<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Étiquettes — Yoann's French Bakery</title>
<meta name="theme-color" content="#1a1a1a">
<link rel="icon" href="logo.png" type="image/png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --creme:#fdf6ec;--papier:#fffdf9;--encre:#1a1a1a;
    --encre-doux:#6b6157;--trait:#e2d7c6;--accent:#2f4858;--r:6px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--creme);color:var(--encre);
    font:16px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  }

  /* ---------- Réglages (écran uniquement) ---------- */
  .reglages{
    background:var(--papier);border-bottom:1px solid var(--trait);
    padding:16px 18px;position:sticky;top:0;z-index:5;
  }
  .reglages .dedans{
    max-width:900px;margin:0 auto;display:flex;gap:14px;
    align-items:center;flex-wrap:wrap;
  }
  .reglages h1{font-size:16px;margin:0;font-weight:600}
  .reglages label{display:flex;align-items:center;gap:7px;font-size:14.5px;cursor:pointer}
  .reglages input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}
  .reglages .compte{color:var(--encre-doux);font-size:14px}
  .reglages button{
    background:var(--accent);color:#fff;border:none;padding:11px 20px;
    border-radius:var(--r);font-size:15px;font-weight:600;cursor:pointer;
  }
  .reglages a{color:var(--accent);font-size:14px}
  .conseil{max-width:900px;margin:14px auto 0;font-size:13.5px;color:var(--encre-doux)}
  .apercu{max-width:900px;margin:22px auto;padding:0 18px 60px}
  .apercu .titre{font-size:13px;color:var(--encre-doux);margin:0 0 10px}
  .vide{padding:60px;text-align:center;color:var(--encre-doux)}

  /* ---------- Étiquette : 60 mm de large, 80 mm de haut ---------- */
  .etiquette{
    width:60mm;height:80mm;padding:3.5mm 4mm;background:#fff;color:#000;
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;display:flex;flex-direction:column;
    border:1px solid var(--trait);margin:0 auto 14px;
  }
  .etiquette .entete{
    display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:.4mm solid #000;padding-bottom:1mm;margin-bottom:2.5mm;
  }
  .etiquette .marque{font-size:7pt;font-weight:700;letter-spacing:.03em}
  .etiquette .ref{font-family:ui-monospace,monospace;font-size:7.5pt}

  .etiquette .genre{
    font-size:7pt;text-transform:uppercase;letter-spacing:.14em;
    color:#000;font-weight:700;
  }
  .etiquette .client{font-size:14pt;font-weight:700;line-height:1.15;margin-top:1mm}
  .etiquette .tel{font-size:12pt;font-weight:600;margin-top:1.2mm}

  /* Adresse de livraison : lue par un livreur, en mouvement */
  .etiquette .adresse{
    font-size:13pt;font-weight:700;line-height:1.25;margin-top:2.5mm;
    border-left:1mm solid #000;padding-left:2mm;
  }

  .etiquette .pied{
    margin-top:auto;border-top:.4mm solid #000;padding-top:1.5mm;
  }
  .etiquette .lieu{
    font-size:11pt;font-weight:700;text-transform:uppercase;
    letter-spacing:.02em;line-height:1.2;
  }
  .etiquette .quand{font-size:10pt;margin-top:.8mm}

  /* Étiquette contenu */
  .etiquette .qui{
    display:flex;justify-content:space-between;gap:2mm;
    font-size:9pt;margin-bottom:1.5mm;
  }
  .etiquette .qui b{font-size:10pt}
  .etiquette .lignes{flex:1;overflow:hidden}
  .etiquette .l{
    display:flex;gap:2mm;font-size:11.5pt;line-height:1.3;
    padding:.7mm 0;border-bottom:.2mm dotted #bbb;
  }
  .etiquette .l .q{font-weight:700;min-width:8mm}
  .etiquette .l .n{flex:1}
  .etiquette .demande{
    margin-top:1.5mm;border:.3mm solid #000;border-radius:1mm;
    padding:1.2mm 1.5mm;min-height:9mm;
  }
  .etiquette .demande .titre{
    font-size:6.5pt;text-transform:uppercase;letter-spacing:.12em;color:#444;
  }
  .etiquette .demande .texte{font-size:9.5pt;line-height:1.25;font-weight:600;margin-top:.4mm}
  .etiquette .demande.vierge{border-style:dashed;border-color:#999}
  .etiquette .page{font-size:7pt;font-weight:700}
  .etiquette .mode{
    font-size:8.5pt;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .etiquette .argent{
    margin-top:auto;border-top:.4mm solid #000;padding-top:1.5mm;
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:11pt;font-weight:700;
  }
  .etiquette .argent .statut{letter-spacing:.08em}

  /* ---------- Impression ---------- */
  @page{ size:60mm 80mm; margin:0 }
  @media print{
    .reglages,.conseil,.apercu .titre{display:none !important}
    body{background:#fff}
    .apercu{margin:0;padding:0;max-width:none}
    .etiquette{border:none;margin:0;page-break-after:always;break-after:page}
    .etiquette:last-child{page-break-after:auto;break-after:auto}
  }
</style>
</head>
<body>

<div class="reglages">
  <div class="dedans">
    <h1>Étiquettes</h1>
    <label><input type="checkbox" id="optAdresse" checked> Adresse</label>
    <label><input type="checkbox" id="optContenu" checked> Contenu</label>
    <span class="compte" id="compte"></span>
    <button id="btnImprimer">Imprimer</button>
    <a href="commandes-admin.html">Retour aux commandes</a>
  </div>
  <p class="conseil">
    Dans la fenêtre d'impression : marges <b>Aucune</b>, échelle <b>100 %</b>,
    et décochez <b>En-têtes et pieds de page</b>. Format : 60 × 80 mm, vertical.
  </p>
</div>

<div class="apercu">
  <p class="titre">Aperçu — une étiquette par vignette</p>
  <div id="liste"><div class="vide">Chargement…</div></div>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
const peso = (n) => "P" + Number(n || 0).toLocaleString("en-PH");
const MARQUE = "YOANN'S FRENCH BAKERY";
const MAX_LIGNES = 8;   // articles par étiquette avant passage à la suivante

let commandes = [];
try { commandes = JSON.parse(sessionStorage.getItem("etiquettes") || "[]"); }
catch { commandes = []; }

if (!commandes.length) {
  $("liste").innerHTML =
    '<div class="vide">Aucune commande à imprimer.<br><br>' +
    'Sélectionnez des commandes dans le tableau de bord, ' +
    'puis cliquez sur « Imprimer les étiquettes ».</div>';
  $("compte").textContent = "";
} else {
  $("compte").textContent = commandes.length +
    (commandes.length > 1 ? " commandes" : " commande");
  $("optAdresse").onchange = dessiner;
  $("optContenu").onchange = dessiner;
  $("btnImprimer").onclick = () => window.print();
  dessiner();
}

function libelleMode(c) {
  return c.option?.type === "livraison" ? "DELIVERY" : (c.option?.nom || "");
}

function panne(ref, type) {
  return `<div class="etiquette"><div class="entete">
    <span class="mode">ERREUR</span><span class="ref">${ref}</span></div>
    <div class="lignes" style="font-size:9pt">
    Étiquette ${type} impossible à générer pour cette commande.
    Voir la console (F12).</div></div>`;
}

function ech(t) {
  return String(t ?? "").replace(/[&<>"]/g, x =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[x]));
}

function jourLong(iso) {
  if (!iso) return "";
  return new Date(iso + "T12:00:00")
    .toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
}

function dessiner() {
  const adresse = $("optAdresse").checked;
  const contenu = $("optContenu").checked;
  const liste = $("liste");
  liste.innerHTML = "";

  if (!adresse && !contenu) {
    liste.innerHTML = '<div class="vide">Cochez au moins un type d\'étiquette.</div>';
    return;
  }
  // Une commande fautive ne doit pas empêcher l'impression des autres.
  commandes.forEach(c => {
    const ref = c.numero || c.id || "?";
    if (adresse) {
      try { liste.insertAdjacentHTML("beforeend", etiquetteAdresse(c)); }
      catch (e) { console.error("Étiquette adresse", ref, e); liste.insertAdjacentHTML("beforeend", panne(ref, "adresse")); }
    }
    if (contenu) {
      try { liste.insertAdjacentHTML("beforeend", etiquetteContenu(c)); }
      catch (e) { console.error("Étiquette contenu", ref, e); liste.insertAdjacentHTML("beforeend", panne(ref, "contenu")); }
    }
  });
}

/* ---------- Étiquette adresse ----------
   Livraison : l'adresse du client domine, elle est lue par le livreur.
   Retrait   : le point de rendez-vous domine, sans horaire ni détail de lieu. */
function etiquetteAdresse(c) {
  const livraison = c.option?.type === "livraison";

  return `
  <div class="etiquette">
    <div class="entete">
      <span class="marque">${MARQUE}</span>
      <span class="ref">${ech(c.numero || c.id)}</span>
    </div>

    <div class="genre">${livraison ? "Deliver to" : "Pick up"}</div>
    <div class="client">${ech(c.client?.nom || "")}</div>
    <div class="tel">${ech(c.client?.telephone || "")}</div>

    ${livraison && c.client?.adresse
      ? `<div class="adresse">${ech(c.client.adresse)}</div>` : ""}

    <div class="pied">
      <div class="lieu">${ech(libelleMode(c))}</div>
      <div class="quand">${ech(jourLong(c.date_retrait))}</div>
    </div>
  </div>`;
}

/* ---------- Étiquette contenu ----------
   Au-delà de MAX_LIGNES articles, la commande se poursuit sur une
   deuxième étiquette. Le montant ne figure que sur la dernière. */
function etiquetteContenu(c) {
  const articles = c.panier || [];
  const paquets = [];
  for (let i = 0; i < Math.max(articles.length, 1); i += MAX_LIGNES)
    paquets.push(articles.slice(i, i + MAX_LIGNES));

  return paquets.map((paquet, n) =>
    uneEtiquetteContenu(c, paquet, n + 1, paquets.length)).join("");
}

function uneEtiquetteContenu(c, paquet, n, total) {
  const paye = (c.paiement?.statut || "en attente") === "paye";
  const derniere = n === total;

  const lignes = paquet.map(l =>
    `<div class="l"><span class="q">${l.qte}×</span>
     <span class="n">${ech(l.nom)}</span></div>`).join("");

  return `
  <div class="etiquette">
    <div class="entete">
      <span class="mode">${ech(libelleMode(c))}</span>
      ${total > 1 ? `<span class="page">${n}/${total}</span>` : ""}
      <span class="ref">${ech(c.numero || c.id)}</span>
    </div>

    <div class="qui">
      <b>${ech(c.client?.nom || "")}</b>
      <span>${ech(jourLong(c.date_retrait))}</span>
    </div>

    <div class="lignes">${lignes}</div>

    ${derniere ? `
    <div class="demande ${c.notes ? "" : "vierge"}">
      <div class="titre">Special request</div>
      ${c.notes ? `<div class="texte">${ech(c.notes)}</div>` : ""}
    </div>

    <div class="argent">
      <span class="statut">${paye ? "PAID" : "TO PAY"}</span>
      <span>${peso(c.total)}${c.frais_a_confirmer ? " +" : ""}</span>
    </div>` : `
    <div class="argent">
      <span class="statut">CONTINUED</span>
      <span>&#8594;</span>
    </div>`}
  </div>`;
}
</script>
</body>
</html>
