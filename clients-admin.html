<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clients — Yoann's French Bakery</title>
<meta name="theme-color" content="#1a1a1a">
<link rel="icon" href="logo.png" type="image/png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<!-- Carte OpenStreetMap : aucune clé, aucun compte, aucune facturation.
     Sert à poser le point de livraison à la main — les adresses de Manille
     sont trop mal référencées pour faire confiance à une recherche. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --creme:#fdf6ec;--papier:#fffdf9;--encre:#1f1b16;
    --encre-doux:#6b6157;--trait:#e2d7c6;--accent:#2f4858;
    --alerte:#8c2f22;--ok:#3d6b3d;--r:6px;
    --vide:#5a5285;--recent:#a85a1c;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--creme);color:var(--encre);
    font:18px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding-bottom:90px;
  }
  header{
    background:var(--encre);color:var(--creme);padding:14px 18px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  header h1{font-size:19px;margin:0;font-weight:600}
  header .qui{margin-left:auto;font-size:14.5px;opacity:.72}
  header button{
    background:transparent;border:1px solid #4a443c;color:var(--creme);
    padding:8px 13px;border-radius:var(--r);font-size:15px;cursor:pointer;
  }
  main{max-width:880px;margin:0 auto;padding:20px 16px}

  .outils{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .outils input[type=text]{
    flex:1;min-width:180px;padding:11px 12px;border:1px solid var(--trait);
    border-radius:var(--r);background:#fff;font:inherit;font-size:17px;color:var(--encre);
  }
  .outils select{
    padding:11px 10px;border:1px solid var(--trait);border-radius:var(--r);
    background:#fff;font:inherit;font-size:16.5px;color:var(--encre);
  }
  button.action{
    background:var(--accent);color:#fff;border:none;padding:11px 18px;
    border-radius:var(--r);cursor:pointer;font-size:16.5px;font-weight:600;
  }
  button.action:disabled{opacity:.5;cursor:default}
  button.mineur{
    background:transparent;color:var(--accent);border:1px solid var(--trait);
    padding:10px 15px;border-radius:var(--r);cursor:pointer;font-size:16.5px;
  }

  .client{
    background:var(--papier);border:1px solid var(--trait);
    border-left:4px solid #7a2331;
    border-radius:var(--r);padding:14px;margin-bottom:10px;
  }
  /* Violet : la fiche n'a jamais eu de commande — il n'y a encore rien
     dessus à part le téléphone. Orange : la dernière commande date de
     moins d'une semaine. Ni l'un ni l'autre : couleur par défaut
     ci-dessus, inchangée. */
  .client.vide{border-left-color:var(--vide)}
  .client.recent{border-left-color:var(--recent)}
  /* Bleu quand la fiche est ouverte : on voit d'un coup d'œil où l'on
     travaille dans une longue liste — l'emporte sur violet/orange,
     puisque savoir où l'on est en train de travailler prime sur l'état
     de contenu pendant qu'on la consulte. */
  .rattache{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:7px}
  .rattache[hidden]{display:none}
  .rattache select{
    flex:1;min-width:170px;padding:8px 10px;border:1px solid var(--trait);
    border-radius:var(--r);font:inherit;font-size:15px;background:#fff;color:var(--encre);
  }
  .client.ouvert{border-left-color:#2f4858}
  /* Repérage temporaire en arrivant depuis une commande, même effet que sur
     la page Commandes pour que le geste soit reconnaissable. */
  .client.cible{animation:surligne-cli 2.6s ease-out}
  @keyframes surligne-cli{
    0%   {box-shadow:0 0 0 3px var(--accent)}
    75%  {box-shadow:0 0 0 3px var(--accent)}
    100% {box-shadow:0 0 0 3px transparent}
  }
  .client.archive{opacity:.66}
  .client.archive .tete .nom::after{
    content:"archivé";font-size:12.5px;font-weight:400;
    color:var(--encre-doux);margin-left:8px;
    text-transform:uppercase;letter-spacing:.05em;
  }
  .tete{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;cursor:pointer}
  .tete .nom{font-weight:600;flex:1;min-width:130px}
  .tete .tel{font-family:ui-monospace,monospace;font-size:14.5px;color:var(--encre-doux)}
  .tete .chiffre{font-size:14.5px;color:var(--encre-doux)}
  .puce{
    font-size:13px;padding:2px 8px;border-radius:10px;
    background:#e8eef1;color:var(--accent);
  }
  .puce.groupe{font-weight:600}
  /* Fiches incomplètes : un bloc à part, en tête, plutôt qu'une couleur dans
     la liste alphabétique. Un client créé par une commande arrive sans tag ni
     point de livraison — noyé au milieu de tous les autres, il n'est jamais
     retrouvé et le travail ne se fait pas. */
  .bloc-titre{
    display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
    margin:0 0 10px;font-size:16px;font-weight:600;color:var(--encre);
  }
  .bloc-titre .aide{font-size:14px;font-weight:400;color:var(--encre-doux)}
  #aCompleter{margin-bottom:22px;padding-bottom:6px;border-bottom:2px solid var(--trait)}
  #aCompleter[hidden]{display:none}
  #demenagements{margin-bottom:22px}
  #demenagements[hidden]{display:none}
  .demenagement{
    border:1px solid var(--trait);border-left:3px solid var(--accent);
    border-radius:var(--r);background:var(--papier);padding:13px 15px;margin-bottom:9px;
  }
  .dm-nom{font-weight:600;margin-bottom:8px}
  .dm-nom .aide{font-weight:400;font-size:14px;color:var(--encre-doux)}
  .dm-lignes{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;
    font-size:15.5px;
  }
  .dm-lignes .aide{display:block;font-size:13.5px;color:var(--encre-doux);margin-bottom:2px}
  .dm-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:11px}
  .manque{
    font-size:13px;padding:2px 8px;border-radius:10px;
    background:#f6e2de;color:#8c2f22;font-weight:600;
  }
  .criteres{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}
  .criteres:empty{display:none}
  .criteres .crit{
    display:inline-flex;align-items:center;gap:7px;padding:5px 7px 5px 11px;
    border:1px solid var(--trait);border-radius:99px;background:#fff;
    font-size:14.5px;color:var(--encre);
  }
  .criteres .crit button{
    border:none;background:transparent;color:var(--encre-doux);
    font-size:17px;line-height:1;cursor:pointer;padding:0 3px;
  }
  .compte-res{font-size:14.5px;color:var(--encre-doux);margin:0 0 12px}

  .detail{margin-top:14px;padding-top:14px;border-top:1px dashed var(--trait)}
  .detail[hidden]{display:none}
  .grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:13px}
  label{display:block;font-size:14.5px;color:var(--encre-doux);margin-bottom:5px}
  input[type=text],textarea{
    width:100%;padding:10px 11px;border:1px solid var(--trait);
    border-radius:var(--r);background:#fff;font:inherit;font-size:17px;color:var(--encre);
  }
  textarea{min-height:58px;resize:vertical}
  .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px;align-items:center}
  .lien{
    display:inline-block;padding:9px 14px;border:1px solid var(--trait);
    border-radius:var(--r);text-decoration:none;color:var(--accent);font-size:16px;
  }

  .vide{padding:40px;text-align:center;color:var(--encre-doux)}
  .barre{
    position:fixed;bottom:0;left:0;right:0;background:var(--papier);
    border-top:1px solid var(--trait);padding:12px 16px;display:flex;gap:12px;align-items:center;
  }
  .etat{font-size:15px;color:var(--encre-doux);margin-right:auto}
  .etat.ok{color:var(--ok)}
  .etat.err{color:var(--alerte)}
  .connexion{max-width:400px;margin:14vh auto;text-align:center;padding:0 20px}
  .connexion h1{font-size:23.5px;margin:0 0 20px}
</style>
</head>
<body>

<div id="ecranConnexion" class="connexion">
  <h1>Clients</h1>
  <button class="action" id="btnConnexion">Se connecter avec Google</button>
  <p id="msgConnexion" style="margin-top:18px;font-size:16px"></p>
</div>

<div id="app" hidden>
  <header>
    <h1>Fichier clients</h1>
    <span class="qui" id="qui"></span>
    <button id="btnDeconnexion">Quitter</button>
  </header>

  <main>
    <div class="outils">
      <input type="text" id="recherche" placeholder="Rechercher un nom, un numéro, un tag…">
      <!-- « Tags » et non « groupes » : le groupe tarifaire est un autre champ,
           en lecture seule sur la fiche et réglé dans Crédit. Deux menus qui
           parlent de groupes prêtaient à confusion. -->
      <select id="filtreGroupe"><option value="">Tous les tags</option></select>
      <label style="display:flex;align-items:center;gap:7px;margin:0;font-size:15.5px;color:var(--encre)">
        <input type="checkbox" id="voirMasques" style="width:auto"> Archivés et tests
      </label>
      <label style="display:flex;align-items:center;gap:7px;margin:0;font-size:15.5px;color:var(--encre)">
        <input type="checkbox" id="seulementACompleter" style="width:auto"> À compléter seulement
      </label>
      <button class="mineur" id="btnImporter">Importer depuis les commandes</button>
      <button class="mineur" id="btnGroupes">Groupes tarifaires</button>
    </div>

    <!-- Gestion des groupes : replié par défaut, c'est un réglage occasionnel
         et non un outil de tous les jours. -->
    <div class="fiche" id="carteGroupes" hidden style="margin-bottom:14px">
      <div style="padding:15px 16px">
        <label>Groupes tarifaires</label>
        <p class="chiffre" style="margin:2px 0 10px">
          Un groupe n'est qu'une étiquette : la remise et sa portée se règlent
          sur la fiche d'un client, puis se propagent avec « Appliquer à tout
          le groupe ».
        </p>
        <div id="listeGroupes"></div>
        <div style="display:flex;gap:9px;margin-top:11px;flex-wrap:wrap">
          <input type="text" id="nouveauGroupe" placeholder="Nom du nouveau groupe"
                 style="flex:1;min-width:180px">
          <button class="mineur" id="btnAjouterGroupe" type="button">Ajouter</button>
        </div>
        <span class="chiffre" id="etatGroupes"></span>
      </div>
    </div>

    <div class="criteres" id="criteres"></div>
    <div class="compte-res" id="compteRes" hidden></div>

    <!-- Changements d'adresse repérés au dernier import. Vide et masqué tant
         qu'aucun import n'a tourné : ce n'est pas un état permanent de la
         page, c'est le compte rendu d'une action. -->
    <div id="demenagements" hidden></div>

    <!-- Bloc des fiches incomplètes, au-dessus de la liste alphabétique.
         Les fiches qui s'y trouvent en sont retirées : les voir deux fois
         ferait douter qu'on ait déjà traité la première. -->
    <div id="aCompleter" hidden>
      <div class="bloc-titre">
        <span id="aCompleterTitre">À compléter</span>
        <span class="aide">tag manquant, ou adresse sans point de livraison</span>
      </div>
      <div id="listeACompleter"></div>
    </div>

    <div id="liste"><div class="vide">Chargement…</div></div>
  </main>

  <div class="barre">
    <span class="etat" id="etat"></span>
    <button class="action" id="btnEnregistrer">Enregistrer</button>
  </div>
</div>

<script src="admin-nav.js" defer></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, getDoc, setDoc, deleteDoc, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getFunctions, httpsCallable }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js";

const firebaseConfig = {
  apiKey: "AIzaSyDuq8KS8M_Z8U7BlSp6MvE-6Y9OYYaDujE",
  authDomain: "bakertools-ae124.firebaseapp.com",
  projectId: "bakertools-ae124",
  storageBucket: "bakertools-ae124.firebasestorage.app",
  messagingSenderId: "978584667113",
  appId: "1:978584667113:web:868cc89788aff27717c178"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);
// Les clés Lalamove vivent côté serveur : cette page ne fait qu'appeler les
// fonctions. La région doit correspondre au déploiement, sinon appel dans le vide.
const fns  = getFunctions(app, "asia-southeast1");
const $    = (id) => document.getElementById(id);
const peso = (n) => "₱" + Number(n || 0).toLocaleString("en-PH");

let clients = [];        // { id, nom, telephone, adresse, groupe, tags[], notes, nb_commandes, total_depense, derniere_commande, archive }

/* 12 couleurs pastel distinctes, dans l'esprit des badges déjà utilisés
   sur le site (fond doux, texte foncé assorti). Un même segment garde
   toujours la même couleur d'une ouverture à l'autre — une couleur qui
   changerait à chaque rechargement rendrait le repérage visuel inutile
   plutôt que de l'aider. Au-delà de 12 segments distincts, deux segments
   peuvent partager une couleur (limite demandée) ; le texte du badge
   reste dans tous les cas le vrai repère fiable. */
const PALETTE_SEGMENTS = [
  ["#efe6d8", "#8a5a1c"], ["#dfe8ee", "#2d5771"], ["#e2eede", "#33632f"],
  ["#f6e2de", "#8c2f22"], ["#e6e3f0", "#4a4270"], ["#eae6df", "#6d665c"],
  ["#fbead2", "#8a5a1c"], ["#dde9e6", "#2f6a5c"], ["#f0e0ea", "#7a3560"],
  ["#e4e9f5", "#3a4a7a"], ["#f5e8d8", "#7a5620"], ["#e0eaea", "#3a6666"]
];

function couleurSegment(nom) {
  let h = 0;
  for (const car of String(nom)) h = (h * 31 + car.charCodeAt(0)) >>> 0;
  return PALETTE_SEGMENTS[h % PALETTE_SEGMENTS.length];
}
const modifies = new Set();

/* Comptes clients de la boutique, indexés par téléphone. Le groupe tarifaire
   et la remise vivent sur le compte (collection « comptes »), pas sur la fiche
   client (collection « clients ») : les deux sont rapprochés par le numéro,
   seul point commun entre elles. */
let comptesParTel = new Map();
/* Comptes boutique indexés par numéro de mobile (clé normalisée). Depuis que
   « My account » demande le numéro à la connexion, c'est lui qui rapproche un
   compte d'une fiche client et de ses commandes, sans passer par l'e-mail —
   que la moitié des clients ne donnent jamais. */
let comptesParTelephone = new Map();

/* Groupes tarifaires — lus dans Firestore, partagés avec l'admin Crédit.
   Le document se crée tout seul au premier chargement avec les groupes
   historiques : aucune fiche existante n'est affectée, elles portent déjà
   le nom du groupe en texte et il reste valable.

   « Test » n'ouvre aucun tarif : il sert à écarter une fiche des listes et
   à autoriser sa suppression définitive. */
const GROUPES_DOC = "parametres/groupes_tarifaires";
const GROUPES_HISTORIQUES = ["Reseller", "Bulk order"];
let GROUPES_TARIF = [];

async function chargerGroupes() {
  try {
    const s = await getDoc(doc(db, GROUPES_DOC));
    if (s.exists() && Array.isArray(s.data().groupes)) {
      GROUPES_TARIF = s.data().groupes.filter(Boolean);
    } else {
      GROUPES_TARIF = [...GROUPES_HISTORIQUES];
      await setDoc(doc(db, GROUPES_DOC), { groupes: GROUPES_TARIF }, { merge: true });
    }
  } catch (e) {
    // Sans la liste, on retombe sur les groupes historiques : la page reste
    // utilisable, seule la création de nouveaux groupes est indisponible.
    console.error(e);
    GROUPES_TARIF = [...GROUPES_HISTORIQUES];
  }
}

async function ecrireGroupes(liste) {
  await setDoc(doc(db, GROUPES_DOC), { groupes: liste }, { merge: true });
  GROUPES_TARIF = liste;
}
const SEGMENT_TEST = "Test";

/* Les numéros ne sont pas saisis de la même façon des deux côtés : on ne
   compare que les chiffres, et seulement les dix derniers, pour absorber
   les préfixes (+63, 0…). */
function cleTel(t) {
  const chiffres = String(t || "").replace(/\D/g, "");
  return chiffres.length > 10 ? chiffres.slice(-10) : chiffres;
}

function compteDe(c) {
  // L'e-mail vient des commandes passées en étant connecté. Une fiche sans
  // e-mail (client invité, ou commandes antérieures à sa collecte) n'a pas
  // de compte rattachable : la case tarif reste vide, à juste titre.
  const cle = (c.email || "").trim().toLowerCase();
  return cle ? (comptesParTel.get(cle) || null) : null;
}

// Une fiche de test est écartée des listes courantes, comme une archivée.
/* Extraction des coordonnées d'un lien Google Maps. Le lien est conservé tel
   quel — il sert à ouvrir la navigation quand Yoann livre lui-même — et les
   coordonnées en sont tirées pour Lalamove, qui n'accepte que du GPS.

   Les liens courts (maps.app.goo.gl) ne contiennent pas les coordonnées : il
   faudrait les déplier côté serveur. On les refuse explicitement plutôt que
   d'enregistrer un point faux. */
function extraireCoordonnees(texte) {
  const t = (texte || "").trim();
  if (!t) return { etat: "vide" };

  if (/maps\.app\.goo\.gl|goo\.gl\/maps/i.test(t)) {
    return { etat: "court" };
  }

  // Formes rencontrées, de la plus fiable à la plus permissive :
  // !3d<lat>!4d<lng> (le point exact désigné par Maps), @lat,lng (le centre
  // de la vue), ?q=lat,lng, puis un simple « lat, lng » collé à la main.
  const motifs = [
    /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,
    /@(-?\d+\.\d+),(-?\d+\.\d+)/,
    /[?&]q=(-?\d+\.\d+),\s*(-?\d+\.\d+)/,
    /^(-?\d+\.\d+),\s*(-?\d+\.\d+)$/
  ];
  for (const m of motifs) {
    const r = t.match(m);
    if (r) {
      const lat = parseFloat(r[1]), lng = parseFloat(r[2]);
      // Garde-fou : Metro Manila et ses environs. Un point hors de cette
      // zone vient presque toujours d'un lien mal copié.
      if (lat < 13 || lat > 16 || lng < 120 || lng > 122) {
        return { etat: "hors_zone", lat, lng };
      }
      return { etat: "ok", lat, lng };
    }
  }
  return { etat: "illisible" };
}

function estTest(c) {
  return (c.groupe || "").trim().toLowerCase() === SEGMENT_TEST.toLowerCase();
}
function estMasque(c) {
  return !!c.archive || estTest(c);
}

/* ---------- Connexion ---------- */
$("btnConnexion").onclick = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) {
    $("msgConnexion").textContent = "Connexion impossible. Autorisez les fenêtres surgissantes.";
    console.error(e);
  }
};
$("btnDeconnexion").onclick = () => signOut(auth);

onAuthStateChanged(auth, async (user) => {
  if (!user) { $("app").hidden = true; $("ecranConnexion").hidden = false; return; }
  let autorise = false;
  try { autorise = (await getDoc(doc(db, "admins", user.uid))).exists(); }
  catch (e) { console.error(e); }
  if (!autorise) {
    await signOut(auth);
    $("msgConnexion").innerHTML =
      "Ce compte n'a pas accès.<br>Identifiant : <code>" + user.uid + "</code>";
    return;
  }
  $("ecranConnexion").hidden = true;
  $("app").hidden = false;
  $("qui").textContent = user.email;
  charger();
});

/* ---------- Chargement ---------- */
/* ---------- Gestion des groupes tarifaires ---------- */
function etatGroupes(texte, type) {
  const e = $("etatGroupes");
  if (!e) return;
  e.textContent = texte || "";
  e.style.color = type === "err" ? "var(--alerte)"
                : type === "ok"  ? "var(--ok)" : "var(--encre-doux)";
}

function rendreGroupes() {
  const zone = $("listeGroupes");
  if (!zone) return;
  zone.innerHTML = "";
  if (!GROUPES_TARIF.length) {
    zone.innerHTML = '<div class="chiffre">Aucun groupe pour l\'instant.</div>';
    return;
  }
  GROUPES_TARIF.forEach(nom => {
    const ligne = document.createElement("div");
    ligne.style.cssText = "display:flex;align-items:center;gap:9px;padding:6px 0;"
                        + "border-bottom:1px solid var(--trait)";
    const t = document.createElement("span");
    t.style.flex = "1";
    t.textContent = nom;
    const b = document.createElement("button");
    b.type = "button";
    b.className = "mineur";
    b.textContent = "Retirer";
    b.onclick = () => retirerGroupe(nom);
    ligne.append(t, b);
    zone.appendChild(ligne);
  });
}

async function ajouterGroupe() {
  const champ = $("nouveauGroupe");
  const nom = (champ.value || "").trim();
  if (!nom) { etatGroupes("Saisissez un nom."); return; }
  if (GROUPES_TARIF.some(g => g.toLowerCase() === nom.toLowerCase())) {
    etatGroupes("Ce groupe existe déjà."); return;
  }
  try {
    await ecrireGroupes([...GROUPES_TARIF, nom]);
    champ.value = "";
    rendreGroupes();
    etatGroupes("Groupe « " + nom + " » ajouté. Rechargez pour le voir dans les fiches.", "ok");
  } catch (e) {
    console.error(e);
    etatGroupes("Enregistrement impossible.", "err");
  }
}

/* Retirer un groupe ne touche aucune fiche : les comptes qui le portent le
   gardent, et il reste proposé dans leur menu tant qu'il y est inscrit. On
   ne fait que le sortir des choix offerts aux autres. */
async function retirerGroupe(nom) {
  const portes = [...comptesParTel.values()].filter(c => c.groupe === nom).length;
  const avertissement = portes
    ? "\n\n" + portes + " compte(s) portent encore ce groupe. Leur tarif est conservé."
    : "";
  if (!confirm("Retirer le groupe « " + nom + " » de la liste ?" + avertissement)) return;
  try {
    await ecrireGroupes(GROUPES_TARIF.filter(g => g !== nom));
    rendreGroupes();
    etatGroupes("Groupe « " + nom + " » retiré.", "ok");
  } catch (e) {
    console.error(e);
    etatGroupes("Suppression impossible.", "err");
  }
}

async function charger() {
  try {
    // La liste des groupes avant tout : les fiches en peuplent leur menu.
    await chargerGroupes();
    rendreGroupes();

    // Les comptes d'abord : les fiches en ont besoin pour afficher le tarif.
    /* Index des comptes par e-mail, et non par téléphone : les documents
       « comptes » sont créés par connexion Google et ne portent pas de
       numéro. L'ancien index par téléphone restait donc toujours vide, et
       aucune fiche ne trouvait son compte. */
    comptesParTel = new Map();
    comptesParTelephone = new Map();
    try {
      const sc = await getDocs(collection(db, "comptes"));
      sc.forEach(d => {
        const v = d.data();
        const cle = (v.email || "").trim().toLowerCase();
        const cleT = cleTel(v.telephone);
        if (cleT) comptesParTelephone.set(cleT, { id: d.id, email: cle, nom: v.nom || "" });
        if (cle) comptesParTel.set(cle, {
          id: d.id,
          email: cle,
          // Nom affiché dans le sélecteur de rattachement : un e-mail seul
          // ne suffit pas toujours à reconnaître un client.
          nom: v.nom || "",
          groupe: v.groupe || "",
          remise: Number(v.remise) || 0,
          solde: Number(v.solde) || 0
        });
      });
    } catch (e) {
      // Sans les comptes, la page reste utilisable : le tarif s'affiche vide.
      console.error(e);
    }

    const s = await getDocs(collection(db, "clients"));
    clients = [];
    s.forEach(d => {
      const v = d.data();
      clients.push({
        id: d.id,
        nom: v.nom || "",
        telephone: v.telephone || d.id,
        telephone_local: v.telephone_local || "",
        // Sans cette recopie, compteDe() ne trouverait jamais rien —
        // même piège que les champs de portée dans credits-admin.html.
        email: v.email || "",
        adresse: v.adresse || "",
        // Divergence d'adresse déjà écartée, sous forme normalisée.
        adresse_ignoree: v.adresse_ignoree || "",
        maps_url: v.maps_url || "",
        coordonnees: v.coordonnees || null,
        groupe: v.groupe || "",
        tags: Array.isArray(v.tags) ? v.tags : [],
        notes: v.notes || "",
        nb_commandes: v.nb_commandes || 0,
        total_depense: v.total_depense || 0,
        derniere_commande: v.derniere_commande || "",
        archive: v.archive === true
      });
    });
    trier();
    majGroupes();
    afficher();
    allerVersClient();
  } catch (e) {
    console.error(e);
    $("liste").innerHTML = '<div class="vide">Les clients n\'ont pas pu être chargés.</div>';
  }
}

/* Tri alphabétique par nom, commun aux trois écrans d'administration.
   localeCompare avec sensitivity:"base" ignore la casse et les accents :
   « Élise » se range avec « Elise », et non après tous les Z.
   Les fiches sans nom passent en fin de liste : les reléguer vaut mieux
   que de les empiler en tête, où elles masqueraient le début de l'ordre. */
function parNom(a, b) {
  const na = (a || "").trim(), nb = (b || "").trim();
  if (!na && !nb) return 0;
  if (!na) return 1;
  if (!nb) return -1;
  return na.localeCompare(nb, "fr", { sensitivity: "base" });
}

function trier() {
  // Par nom : la recherche se fait au nom, pas à la date de dernière commande.
  clients.sort((a, b) => parNom(a.nom, b.nom));
}

function majGroupes() {
  const noms = [...new Set(clients.map(c => c.groupe).filter(Boolean))].sort();
  const sel = $("filtreGroupe");
  const actuel = sel.value;
  sel.innerHTML = '<option value="">Tous les tags</option>' +
    noms.map(g => `<option value="${g}">${g}</option>`).join("");
  sel.value = actuel;
}

/* ---------- Import depuis les commandes ---------- */
$("btnGroupes").onclick = () => {
  const c = $("carteGroupes");
  c.hidden = !c.hidden;
  if (!c.hidden) { rendreGroupes(); $("nouveauGroupe").focus(); }
};
$("btnAjouterGroupe").onclick = ajouterGroupe;
$("nouveauGroupe").onkeydown = (e) => { if (e.key === "Enter") ajouterGroupe(); };

$("btnImporter").onclick = async () => {
  if (!confirm("Parcourir les commandes et mettre à jour le fichier clients ?\n\n" +
    "Les noms, e-mails et statistiques sont repris depuis les commandes. " +
    "Vos adresses, points de livraison, tags et notes ne sont pas touchés.\n\n" +
    "Les changements d'adresse repérés vous seront proposés à la fin."))
    return;

  $("btnImporter").disabled = true;
  etat("Import en cours…");

  try {
    const s = await getDocs(collection(db, "commandes"));
    const parTel = {};
    // Commandes à relier à un compte boutique, repérées au passage.
    const aRelier = [];
    s.forEach(d => {
      const c = d.data();
      /* Clé normalisée aux dix derniers chiffres, comme partout ailleurs.
         Un même client qui écrit tantôt 0917…, tantôt +63917… produisait
         auparavant deux clés distinctes, donc deux fiches : la seconde
         naissait sans coordonnées et masquait celle qui les portait. */
      const tel = cleTel(c.client?.telephone);
      if (!tel || c.statut === "annulee") return;

      /* Commande jamais rattachée à un compte : si un compte boutique porte
         ce numéro, c'est celui du client. On note l'appariement ici, on
         écrira plus bas avec le reste. */
      if (!c.compte_uid) {
        const cpteTel = comptesParTelephone.get(tel);
        if (cpteTel) aRelier.push({ id: d.id, uid: cpteTel.id });
      }
      const e = parTel[tel] = parTel[tel] || {
        telephone: tel, brut: (c.client?.telephone || "").replace(/\D/g, ""),
        nom: "", adresse: "", email: "", nb: 0, total: 0, derniere: "",
        // Date de l'adresse retenue : getDocs ne rend pas les commandes dans
        // l'ordre chronologique, « la dernière lue » n'est pas « la plus
        // récente ». Sans ce repère, l'adresse retenue était celle du hasard.
        adresseLe: ""
      };
      // Seul lien avec la collection « comptes ». La commande la plus
      // récente fait foi si le client a changé d'adresse.
      if (c.client?.email) e.email = c.client.email;
      e.nb += 1;
      e.total += Number(c.total) || 0;
      const d1 = c.date_retrait || (c.cree_le || "").slice(0, 10);
      if (c.client?.nom) e.nom = c.client.nom;
      /* Une adresse ponctuelle n'est pas l'adresse du client : il a demandé
         une livraison ailleurs pour cette fois seulement. La retenir la ferait
         passer pour un déménagement, et sur une fiche neuve elle deviendrait
         l'adresse de référence. Le checkout applique déjà la même règle en
         refusant de l'enregistrer sur le compte. */
      if (c.client?.adresse && !c.client?.adresse_ponctuelle && d1 >= e.adresseLe) {
        e.adresse = c.client.adresse;
        e.adresseLe = d1;
      }
      if (d1 > e.derniere) e.derniere = d1;
    });

    /* Indexé sur la même clé que ci-dessus, sinon une fiche enregistrée sous
       un autre format de numéro passe pour inconnue et se fait dupliquer. */
    const existants = {};
    clients.forEach(c => existants[cleTel(c.telephone)] = c);

    // Un lot Firestore accepte au maximum 500 écritures : au-delà, on en
    // ouvre un nouveau plutôt que de laisser commit() échouer d'un coup
    // sur tout l'import dès que l'historique dépasse ce seuil.
    const LOT_MAX = 450;
    const demenagements = [];
    /* Rattachements automatiques rendus possibles par le numéro de mobile
       désormais demandé sur « My account ». Les commandes sans compte_uid
       dont le téléphone correspond à un compte boutique sont reliées à ce
       compte, et l'e-mail du compte est posé sur la fiche client.

       Ce travail se fait ici et non côté client : les règles Firestore
       interdisent à un client de chercher des commandes qui ne sont pas
       déjà les siennes, ce qui est exactement ce qu'il faut. L'import,
       lui, tourne avec vos droits. */
    let paquet = writeBatch(db);
    let dansLot = 0;
    let ajoutes = 0, majs = 0;

    for (const e of Object.values(parTel)) {
      const ancien = existants[e.telephone];
      // Compte boutique portant ce numéro, s'il existe.
      const compteTel = comptesParTelephone.get(cleTel(e.telephone));
      /* Déménagement possible : la fiche porte une adresse, la commande la
         plus récente en porte une autre. Rien n'est écrit ici — on collecte,
         on affichera, tu trancheras. Voir signalerDemenagements(). */
      /* Une divergence déjà écartée ne revient pas. Sans cette mémoire, les
         faux positifs — un repère ajouté par le client, une ville écrite deux
         fois — étaient à revalider à chaque import. */
      if (ancien && ancien.adresse && e.adresse
          && !memeAdresse(ancien.adresse, e.adresse)
          && normAdresse(e.adresse) !== (ancien.adresse_ignoree || "")) {
        demenagements.push({
          id: ancien.telephone, nom: e.nom || ancien.nom,
          ancienne: ancien.adresse, nouvelle: e.adresse, le: e.adresseLe
        });
      }
      // Les statistiques sont recalculées ; tags, groupe et notes restent à vous.
      const fiche = {
        nom: e.nom || (ancien ? ancien.nom : ""),
        telephone: e.telephone,
        /* L'adresse d'une fiche existante n'est jamais remplacée. Les clients
           écrivent la ville deux ou trois fois, ajoutent des repères, oublient
           l'unité : l'adresse de la fiche est nettoyée à la main pour que la
           géolocalisation tombe juste, et un import qui la réécrirait
           détruirait ce travail à chaque nouvelle commande.
           Conséquence à connaître : un déménagement ne remonte pas tout seul
           sur la fiche — c'est le prix de la stabilité du point de livraison. */
        adresse: (ancien && ancien.adresse) ? ancien.adresse : (e.adresse || ""),
        /* Jamais effacé : une commande en invité ne doit pas faire perdre
           le rattachement gagné par une commande connectée précédente.
           Le compte trouvé par téléphone sert de dernier recours : c'est lui
           qui rattrape les clients qui n'ont jamais commandé connectés. */
        email: e.email || (ancien ? (ancien.email || "") : "") || (compteTel ? compteTel.email : ""),
        /* coordonnees et maps_url n'apparaissent volontairement PAS ici.
           Les préserver en les recopiant depuis « ancien » a déjà échoué une
           fois : il a suffi qu'une version antérieure oublie la recopie pour
           que tous les points de livraison soient effacés d'un coup.
           Un champ qu'on n'écrit jamais ne peut pas être effacé — merge:true
           laisse intact ce qui n'est pas mentionné. Le seul chemin qui écrit
           les coordonnées est désormais le clic sur la carte. */
        // Saisi à la main comme les coordonnées : un import ne l'écrase pas.
        telephone_local: ancien ? (ancien.telephone_local || "") : "",
        groupe: ancien ? ancien.groupe : "",
        tags: ancien ? ancien.tags : [],
        notes: ancien ? ancien.notes : "",
        // L'archivage est une décision : un import ne doit pas la défaire.
        archive: ancien ? !!ancien.archive : false,
        nb_commandes: e.nb,
        total_depense: e.total,
        derniere_commande: e.derniere
      };
      /* merge:true également. La fiche reprend déjà tout ce qu'elle connaît
         depuis « ancien », mais si un champ était ajouté ailleurs sans être
         repris ici, un import le détruirait. La fusion l'en empêche. */
      /* Identifiant de la fiche existante quand il y en a une : changer
         d'identifiant reviendrait à créer un doublon et à abandonner le
         travail de géolocalisation porté par l'ancienne. */
      const identifiant = ancien ? ancien.telephone : (e.brut || e.telephone);
      fiche.telephone = identifiant;
      paquet.set(doc(db, "clients", identifiant), fiche, { merge: true });
      ancien ? majs++ : ajoutes++;

      if (++dansLot >= LOT_MAX) {
        await paquet.commit();
        paquet = writeBatch(db);
        dansLot = 0;
      }
    }
    if (dansLot > 0) await paquet.commit();

    /* Rattachement des commandes orphelines à leur compte boutique. Écrit
       après les fiches pour que l'import reste utile même si cette partie
       échoue : un rattachement raté sera repris au prochain import, alors
       qu'une fiche manquante bloquerait le reste. */
    for (let i = 0; i < aRelier.length; i += LOT_MAX) {
      const lot = writeBatch(db);
      aRelier.slice(i, i + LOT_MAX).forEach(r =>
        lot.set(doc(db, "commandes", r.id), { compte_uid: r.uid }, { merge: true }));
      await lot.commit();
    }

    await charger();
    signalerDemenagements(demenagements);
    etat(`${ajoutes} client(s) ajouté(s), ${majs} mis à jour` +
         (aRelier.length ? `, ${aRelier.length} commande(s) rattachée(s) à un compte` : "") +
         ".", "ok");
  } catch (e) {
    console.error(e);
    etat("L'import a échoué.", "err");
  } finally {
    $("btnImporter").disabled = false;
  }
};

/* ---------- Affichage ---------- */
$("recherche").oninput = afficher;
$("filtreGroupe").onchange = afficher;
$("voirMasques").onchange = afficher;

function ech(t) {
  return String(t ?? "").replace(/[&<>"]/g, x =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[x]));
}

/* ---------- Arrivée depuis une commande ----------
   Le lien pointe vers ?client=ID. On amène la fiche à l'écran, on l'ouvre et
   on la signale un instant : arriver en haut d'une liste de plusieurs
   centaines de noms sans savoir lequel on cherchait annulerait l'intérêt du
   lien. Les filtres en cours sont levés, sinon la fiche visée peut être
   masquée par une recherche laissée en place. */
function allerVersClient() {
  const id = new URLSearchParams(location.search).get("client");
  if (!id) return;

  const vise = clients.find(c => c.id === id);
  if (!vise) return;

  // Une fiche archivée ou de test reste atteignable par un lien direct.
  if (estMasque(vise) && !$("voirMasques").checked) {
    $("voirMasques").checked = true;
  }
  $("recherche").value = "";
  $("filtreGroupe").value = "";
  $("seulementACompleter").checked = false;
  afficher();

  // L'URL est nettoyée pour qu'un rechargement ne rejoue pas indéfiniment
  // la même ouverture.
  history.replaceState(null, "", location.pathname);

  const el = [...document.querySelectorAll("[data-client]")]
    .find(x => x.dataset.client === id);
  if (!el) return;
  el._ouvrir();
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.add("cible");
  setTimeout(() => el.classList.remove("cible"), 2600);
}

/* ---------- Changements d'adresse ----------
   L'import ne touche jamais l'adresse d'une fiche existante : c'est
   volontaire, l'adresse de la fiche est nettoyée à la main pour que la
   géolocalisation tombe juste. Conséquence, un déménagement ne remonte
   jamais tout seul. Ce panneau comble le trou sans rien décider à ta place. */

/* Comparaison d'adresses.

   Une égalité stricte ne servait à rien : le client ajoute un repère, oublie
   une virgule, écrit la ville deux fois, et chaque commande passait pour un
   déménagement. On compare donc les mots, pas la chaîne.

   Ne sont retenues que les divergences de fond — numéro d'unité, rue, quartier
   ou résidence différents. Une adresse qui ne fait qu'en préciser une autre
   (« 46A North » puis « 46A North Street near the church ») désigne le même
   endroit et ne remonte pas. */

// Mots vides : présents ou absents au hasard, ils ne disent rien du lieu.
const MOTS_VIDES = new Set([
  "near", "the", "and", "beside", "front", "back", "corner", "side",
  "brgy", "barangay", "city", "metro", "manila", "philippines", "ph",
  "st", "street", "rd", "road", "ave", "avenue", "blk", "block", "no"
]);

function motsAdresse(t) {
  return new Set(
    String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .toLowerCase().replace(/[^a-z0-9]+/g, " ").trim().split(" ")
      .filter(m => m.length >= 2 && !MOTS_VIDES.has(m))
  );
}

// Forme normalisée, utilisée pour mémoriser une divergence écartée.
function normAdresse(t) {
  return [...motsAdresse(t)].sort().join(" ");
}

/* Les mots porteurs d'un chiffre — « 4b », « 46a », « 12 » — désignent
   l'unité, le lot ou le numéro de rue. Ce sont eux qui distinguent deux
   voisins de palier, et ils comptent à part : sans ça, « Unit 4B Greenview »
   et « Unit 9C Greenview » partagent assez de mots pour passer pour la même
   adresse, alors que ce sont deux logements différents. */
function chiffresAdresse(t) {
  return [...motsAdresse(t)].filter(m => /\d/.test(m)).sort().join(" ");
}

function memeAdresse(a, b) {
  const A = motsAdresse(a), B = motsAdresse(b);
  if (!A.size || !B.size) return true;   // rien à comparer : on se tait

  // Numéros différents : c'est une autre adresse, quel que soit le reste.
  if (chiffresAdresse(a) !== chiffresAdresse(b)) return false;

  const communs = [...A].filter(m => B.has(m)).length;

  /* Une adresse entièrement contenue dans l'autre ne fait que la préciser :
     même lieu, texte plus bavard. C'est le cas le plus fréquent. */
  if (communs === A.size || communs === B.size) return true;

  /* Sinon : part de mots partagés, rapportée à la plus courte des deux.
     Le seuil est haut à dessein. Le cas « adresse plus détaillée » est déjà
     traité au-dessus par l'inclusion ; ce qui reste ici, ce sont deux textes
     qui se contredisent sur un mot porteur — « Greenview » contre
     « Bayview » — et ces mots-là désignent des endroits différents même
     quand tout le reste concorde. La marge sert seulement à absorber une
     faute de frappe isolée dans une adresse longue. */
  return communs / Math.min(A.size, B.size) >= 0.8;
}

function signalerDemenagements(liste) {
  const boite = $("demenagements");
  boite.innerHTML = "";
  boite.hidden = !liste.length;
  if (!liste.length) return;

  boite.insertAdjacentHTML("beforeend", `
    <div class="bloc-titre">
      <span>${liste.length} changement(s) d'adresse possible(s)</span>
      <span class="aide">rien n'a été modifié — à vous de trancher</span>
    </div>`);

  liste.forEach(d => {
    const el = document.createElement("div");
    el.className = "demenagement";
    el.innerHTML = `
      <div class="dm-nom">${ech(d.nom)}${d.le ? ' <span class="aide">— commande du ' + ech(d.le) + '</span>' : ""}</div>
      <div class="dm-lignes">
        <div><span class="aide">Sur la fiche</span><div>${ech(d.ancienne)}</div></div>
        <div><span class="aide">Dernière commande</span><div>${ech(d.nouvelle)}</div></div>
      </div>
      <div class="dm-actions">
        <button class="mineur dm-adopter" type="button">Adopter la nouvelle</button>
        <button class="mineur dm-ignorer" type="button">Ignorer</button>
        <span class="chiffre dm-etat"></span>
      </div>`;

    /* Ignorer mémorise, sur la fiche, la forme normalisée de l'adresse
       écartée. Elle ne sera plus signalée. Une adresse encore différente,
       elle, ressortira : c'est cette divergence-là qu'on écarte, pas le
       principe de la surveillance. */
    el.querySelector(".dm-ignorer").onclick = async () => {
      const boutons = el.querySelectorAll("button");
      boutons.forEach(b => b.disabled = true);
      try {
        await setDoc(doc(db, "clients", d.id),
          { adresse_ignoree: normAdresse(d.nouvelle) }, { merge: true });
        const c = clients.find(x => x.id === d.id);
        if (c) c.adresse_ignoree = normAdresse(d.nouvelle);
      } catch (err) {
        // Échec d'écriture : la ligne disparaît quand même pour cet import,
        // elle reviendra au suivant. Mieux que de bloquer l'écran.
        console.error(err);
      }
      el.remove();
      if (!boite.querySelector(".demenagement")) boite.hidden = true;
    };

    el.querySelector(".dm-adopter").onclick = async () => {
      const boutons = el.querySelectorAll("button");
      boutons.forEach(b => b.disabled = true);
      el.querySelector(".dm-etat").textContent = "Enregistrement…";
      try {
        /* Les coordonnées sont effacées en même temps que l'adresse change.
           Les garder ferait pointer le repère sur l'ancien domicile : le
           motard irait au mauvais endroit sans que rien ne le signale, ce qui
           est pire que de ne rien faire. Remise à null, la fiche retombe dans
           le bloc « À compléter » avec la mention « manque : point de
           livraison » — tu la retrouves en haut et tu recliques sur la carte. */
        await setDoc(doc(db, "clients", d.id),
          { adresse: d.nouvelle, coordonnees: null, maps_url: "",
            // L'ancienne mémoire d'écart ne veut plus rien dire : elle portait
            // sur une comparaison avec l'adresse qu'on vient de remplacer.
            adresse_ignoree: "" }, { merge: true });
        const c = clients.find(x => x.id === d.id);
        if (c) {
          c.adresse = d.nouvelle; c.coordonnees = null;
          c.maps_url = ""; c.adresse_ignoree = "";
        }
        el.remove();
        if (!boite.querySelector(".demenagement")) boite.hidden = true;
        afficher();
      } catch (err) {
        console.error(err);
        boutons.forEach(b => b.disabled = false);
        el.querySelector(".dm-etat").textContent = "Échec — réessayez.";
      }
    };

    boite.appendChild(el);
  });
}

/* ----- Fiches incomplètes -----
   Deux manques seulement, et ils ne se valent pas :

   - pas de tag : la fiche n'a pas encore été qualifiée ;
   - une adresse saisie mais aucun point de livraison : Lalamove ne sait pas
     où aller, la course ne partira jamais.

   Le GPS n'est exigé que si une adresse existe. Un client qui vient chercher
   son pain n'a rien à géolocaliser : lui réclamer un point de livraison le
   laisserait dans ce bloc à vie et rendrait le bloc inutile.

   Rien n'est écrit en base : l'état se recalcule à l'affichage. Pas de champ
   « nouveau » à poser, pas de champ à penser à retirer, et une fiche ancienne
   restée incomplète remonte au même titre qu'une fiche du jour. */
function manquesDe(c) {
  const m = [];
  if (!c.groupe) m.push("tag");
  const co = c.coordonnees;
  if (c.adresse && c.adresse.trim() && !(co && co.lat && co.lng)) m.push("point de livraison");
  return m;
}

function estACompleter(c) {
  // Une fiche archivée ou de test n'a rien à réclamer : elle est hors circuit.
  if (estMasque(c)) return false;
  return manquesDe(c).length > 0;
}

function peindreCriteres(f, g, seulement) {
  const puces = [];
  if (f)         puces.push(["recherche", "« " + $("recherche").value.trim() + " »"]);
  if (g)         puces.push(["tag", "Tag " + g]);
  if (seulement) puces.push(["acompleter", "À compléter seulement"]);
  $("criteres").innerHTML = puces.map(([k, t]) =>
    `<span class="crit">${ech(t)}<button type="button" data-crit="${k}"
       title="Retirer ce critère" aria-label="Retirer ce critère">×</button></span>`).join("");
}

$("criteres").onclick = (e) => {
  const b = e.target.closest("button[data-crit]");
  if (!b) return;
  if (b.dataset.crit === "recherche")   $("recherche").value = "";
  if (b.dataset.crit === "tag")         $("filtreGroupe").value = "";
  if (b.dataset.crit === "acompleter")  $("seulementACompleter").checked = false;
  afficher();
};

$("seulementACompleter").onchange = () => afficher();

function afficher() {
  majSuggestionsGroupes();
  const f = $("recherche").value.trim().toLowerCase();
  const g = $("filtreGroupe").value;
  const voirMasques = $("voirMasques").checked;
  const seulement = $("seulementACompleter").checked;
  const liste = $("liste");
  const bloc = $("aCompleter");
  const listeAC = $("listeACompleter");

  peindreCriteres(f, g, seulement);

  const vus = clients.filter(c => {
    // Archivés et fiches de test sortent des listes courantes : ils ne
    // doivent ni encombrer ni compter.
    if (!voirMasques && estMasque(c)) return false;
    if (g && c.groupe !== g) return false;
    if (seulement && !estACompleter(c)) return false;
    if (!f) return true;
    return (c.nom + " " + c.telephone + " " + c.tags.join(" ") + " " + c.groupe)
      .toLowerCase().includes(f);
  });

  /* Le bloc du haut prend les fiches incomplètes, la liste du bas garde les
     autres. Les plus récemment actives en tête : les fiches clients n'ont pas
     de date de création, la dernière commande est le repère le plus proche de
     « celle qui vient d'arriver ». Une fiche sans aucune commande passe en
     queue de bloc — elle a été créée à la main, elle n'urge pas. */
  const incomplets = vus.filter(estACompleter)
    .sort((a, b) => (b.derniere_commande || "").localeCompare(a.derniere_commande || ""));
  const reste = vus.filter(c => !estACompleter(c));

  listeAC.innerHTML = "";
  bloc.hidden = incomplets.length === 0;
  if (incomplets.length) {
    $("aCompleterTitre").textContent = "À compléter (" + incomplets.length + ")";
    incomplets.forEach(c => listeAC.appendChild(carte(c)));
  }

  const cr = $("compteRes");
  cr.hidden = !(f || g || seulement);
  if (!cr.hidden) cr.textContent = vus.length + " fiche(s) sur " + clients.length;

  liste.innerHTML = "";
  if (!vus.length) {
    const masques = clients.filter(estMasque).length;
    liste.innerHTML = '<div class="vide">Aucun client ne correspond.' +
      (!voirMasques && masques
        ? '<br><br>' + masques + ' fiche(s) archivée(s) ou de test sont masquées.'
        : '<br><br>Si le fichier est vide, cliquez sur « Importer depuis les commandes ».') +
      '</div>';
    return;
  }
  if (!reste.length) {
    // Tout est remonté dans le bloc : le dire, plutôt que de laisser un vide
    // qui ressemble à un bug.
    liste.innerHTML = '<div class="vide">Toutes les fiches affichées sont en haut, à compléter.</div>';
    return;
  }

  reste.forEach(c => liste.appendChild(carte(c)));
}

/* ----- Lalamove : points de départ -----
   La liste vit dans Firestore (parametres/lalamove_lieux) et transite par la
   fonction serveur : ajouter un lieu ne demande pas de toucher à cette page.
   Chargée une seule fois par ouverture de page, partagée par toutes les fiches. */
let promesseLieux = null;
function lireLieuxLalamove() {
  if (!promesseLieux) {
    promesseLieux = httpsCallable(fns, "lalamoveLieux")()
      .then(r => r.data)
      .catch(e => { promesseLieux = null; throw e; });
  }
  return promesseLieux;
}

function carte(c) {
  const cpt = compteDe(c);
  const el = document.createElement("div");
  // Violet si aucune commande jamais passée, orange si la dernière date
  // de moins d'une semaine — l'ouverture de la fiche (classe "ouvert",
  // ajoutée plus bas au clic) l'emportera visuellement sur les deux.
  const ilYA7JOURS = new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10);
  const classeEtat = !c.nb_commandes ? " vide"
    : (c.derniere_commande >= ilYA7JOURS ? " recent" : "");
  el.className = "client" + classeEtat + (estMasque(c) ? " archive" : "");
  el.innerHTML = `
    <div class="tete">
      <span class="nom"></span>
      ${c.groupe ? '<span class="puce groupe"></span>' : ""}
      ${c.tags.map(() => '<span class="puce"></span>').join("")}
      ${manquesDe(c).length && !estMasque(c)
        ? '<span class="manque">manque : ' + ech(manquesDe(c).join(" et ")) + '</span>' : ""}
      <span class="tel"></span>
      <span class="chiffre">${c.nb_commandes} cmd · ${peso(c.total_depense)}</span>
    </div>
    <div class="detail" hidden>
      <div class="grille">
        <div><label>Nom</label><input type="text" class="c-nom"></div>
        <div><label>Téléphone</label><input type="text" class="c-tel" readonly
             style="background:#f2ece2;color:var(--encre-doux)"></div>
        <div><label>Numéro local <span style="opacity:.75">— livraison</span></label>
             <input type="text" class="c-tel-local"
                    placeholder="Si le numéro ci-dessus est étranger"></div>
        <!-- Lecture seule, même fond que le téléphone : jamais saisi à la
             main, il est collecté depuis les commandes passées en étant
             connecté. C'est le seul lien avec le compte boutique. -->
        <div><label>E-mail <span class="c-email-info" style="opacity:.75"></span></label>
             <input type="text" class="c-email" readonly
                    style="background:#f2ece2;color:var(--encre-doux)">
             <!-- Les commandes passées sans être connecté ne portent pas
                  d'identifiant de compte : elles n'apparaissent donc jamais
                  dans « My account », même après inscription. Ce bouton fait
                  le rattachement à la main. -->
             <div class="rattache">
               <select class="c-compte"></select>
               <button type="button" class="mineur c-rattacher">Rattacher</button>
               <span class="chiffre c-rattacher-etat"></span>
             </div></div>
        <!-- Clé Firestore inchangée (« groupe ») : seul le libellé bouge.
             Renommer le champ en base obligerait à migrer toutes les fiches
             et à traquer chaque lecture, pour zéro gain visible. -->
        <div><label>Tag</label><input type="text" class="c-groupe" list="groupesConnus"
             placeholder="revendeur, café, habitué…"></div>
        <div>
          <label>Groupe tarifaire <span class="c-tarif-info" style="opacity:.75"></span></label>
          <select class="c-tarif" style="width:100%;padding:10px 11px;border:1px solid var(--trait);
                  border-radius:var(--r);background:#f2ece2;font:inherit;font-size:17px;color:var(--encre-doux)">
            <option value="">Aucun</option>
          </select>
        </div>
      </div>
      <div style="margin-top:13px"><label>Adresse</label>
        <textarea class="c-adresse"></textarea>
        <div style="margin-top:6px;display:flex;align-items:center;gap:9px;flex-wrap:wrap">
          <button class="mineur c-chercher" type="button">Chercher sur la carte</button>
          <span class="chiffre c-chercher-etat"></span>
        </div></div>
      <div style="margin-top:13px">
        <label>Point de livraison <span class="c-maps-etat" style="opacity:.75"></span></label>
        <div style="margin-top:6px">
          <a class="lien c-maps-ouvrir" target="_blank" rel="noopener" hidden>Ouvrir dans Maps</a>
        </div>
        <div class="c-carte" style="margin-top:9px;height:260px;border:1px solid var(--trait);
             border-radius:var(--r);overflow:hidden"></div>
        <div class="chiffre" style="margin-top:5px">
          Cliquez sur la carte ou déplacez le repère pour ajuster le point de livraison.
        </div>
      </div>
      <div class="c-lala" style="margin-top:13px" hidden>
        <label>Livraison Lalamove</label>
        <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
          <select class="c-lala-depart" style="padding:10px 11px;border:1px solid var(--trait);
                  border-radius:var(--r);background:#fff;font:inherit;font-size:17px;color:var(--encre)"></select>
          <button class="mineur c-lala-coter" type="button">Estimer le prix</button>
          <span class="chiffre c-lala-etat"></span>
        </div>
        <div style="margin-top:7px;display:flex;align-items:center;gap:9px;flex-wrap:wrap">
          <button class="mineur c-lala-courser" type="button" hidden
                  style="border-color:var(--alerte);color:var(--alerte)">Commander la course</button>
          <span class="chiffre c-lala-course-etat"></span>
        </div>
      </div>
      <!-- L'ancien champ « Tags (séparés par des virgules) » était ici, sous la
           carte et le bloc Lalamove : invisible en pratique, et concurrent du
           champ Tag ci-dessus. Il est retiré de la saisie, mais le tableau
           « tags » reste lu, affiché en pastilles et cherché : rien n'est
           perdu sur les fiches qui en portent. -->
      <div style="margin-top:13px"><label>Notes</label>
        <textarea class="c-notes"></textarea></div>
      <div class="actions">
        <a class="lien c-wa" target="_blank" rel="noopener">WhatsApp</a>
        <button class="mineur c-archiver" type="button"></button>
        <button class="mineur c-supprimer" type="button" hidden
                style="border-color:var(--alerte);color:var(--alerte)">Supprimer définitivement</button>
        <span class="chiffre">${c.derniere_commande ? "Dernière commande : " + c.derniere_commande : "Aucune commande enregistrée"}</span>
      </div>
    </div>`;

  el.querySelector(".nom").textContent = c.nom || "—";
  el.querySelector(".tel").textContent = c.telephone;
  if (c.groupe) {
    const puceGroupe = el.querySelector(".puce.groupe");
    puceGroupe.textContent = c.groupe;
    const [fond, encre] = couleurSegment(c.groupe);
    puceGroupe.style.background = fond;
    puceGroupe.style.color = encre;
  }
  const puces = [...el.querySelectorAll(".puce:not(.groupe)")];
  c.tags.forEach((t, i) => { if (puces[i]) puces[i].textContent = t; });

  const d = el.querySelector(".detail");
  // Repère pour l'arrivée depuis une commande (?client=…) : le téléphone sert
  // d'identifiant de fiche, il peut contenir un « + » qu'un sélecteur CSS
  // digérerait mal — d'où un dataset parcouru à la main plutôt qu'un id.
  el.dataset.client = c.id;
  el._ouvrir = () => {
    if (!d.hidden) return;
    d.hidden = false;
    el.classList.add("ouvert");
    el._monterCarte();
  };
  el.querySelector(".tete").onclick = () => {
    d.hidden = !d.hidden;
    el.classList.toggle("ouvert", !d.hidden);
    // La carte n'est construite qu'à la première ouverture : en créer une par
    // fiche au chargement mettrait la page à genoux sur plusieurs centaines
    // de clients.
    if (!d.hidden) el._monterCarte();
  };

  d.querySelector(".c-nom").value     = c.nom;
  d.querySelector(".c-tel").value     = c.telephone;
  d.querySelector(".c-tel-local").value = c.telephone_local || "";
  d.querySelector(".c-groupe").value  = c.groupe;
  d.querySelector(".c-adresse").value = c.adresse;
  d.querySelector(".c-notes").value   = c.notes;
  d.querySelector(".c-wa").href = "https://wa.me/" + c.telephone;

  /* ----- E-mail : indicatif, explique pourquoi le tarif s'affiche ou non ----- */
  const champEmail = d.querySelector(".c-email");
  const infoEmail  = d.querySelector(".c-email-info");
  champEmail.value = c.email || "";
  infoEmail.textContent = c.email
    ? "— rattaché au compte boutique"
    : "— collecté à la prochaine commande connectée";

  /* ----- Rattachement manuel au compte boutique -----
     « My account » retrouve les commandes par leur champ compte_uid, écrit au
     checkout seulement si le client était déjà connecté. Une commande passée
     en invité n'en a pas, et rien ne le lui ajoute quand le client s'inscrit
     après coup : il se connecte et ne voit rien.

     Le rapprochement ne peut pas être deviné : le compte porte un e-mail sans
     numéro, la commande un numéro sans e-mail. Il n'existe aucune clé commune,
     seul vous savez que ce compte est cette cliente. D'où un choix explicite
     plutôt qu'une détection.

     Le rattachement écrit deux choses : l'e-mail sur la fiche client, ce qui
     rend permanent le lien avec le compte (tarif de groupe, solde, prochaines
     commandes), et compte_uid sur les commandes déjà passées, ce qui les fait
     apparaître dans son espace. */
  const selCompte = d.querySelector(".c-compte");
  const btnRattacher = d.querySelector(".c-rattacher");
  const etatRattacher = d.querySelector(".c-rattacher-etat");
  const zoneRattache = d.querySelector(".rattache");

  // Fiche déjà rattachée : plus rien à choisir.
  zoneRattache.hidden = !!cpt;

  if (!cpt) {
    /* Comptes non encore rattachés à une fiche. En proposer un déjà pris
       mènerait à deux fiches pointant le même compte, donc à un solde et un
       tarif partagés entre deux clients. */
    const prisEmails = new Set(clients.map(x => (x.email || "").trim().toLowerCase()).filter(Boolean));
    const libres = [...comptesParTel.values()]
      .filter(a => !prisEmails.has(a.email))
      .sort((a, b) => (a.nom || a.email).localeCompare(b.nom || b.email));

    selCompte.innerHTML = libres.length
      ? '<option value="">Choisir un compte…</option>' +
        libres.map(a => `<option value="${ech(a.email)}">${
          ech(a.nom ? a.nom + " — " + a.email : a.email)}</option>`).join("")
      : '<option value="">Aucun compte disponible</option>';
    btnRattacher.disabled = !libres.length;
  }

  btnRattacher.onclick = async () => {
    const email = selCompte.value;
    if (!email) { etatRattacher.textContent = "Choisissez un compte."; return; }
    const compte = comptesParTel.get(email);
    if (!compte) { etatRattacher.textContent = "Compte introuvable."; return; }

    btnRattacher.disabled = true;
    etatRattacher.textContent = "Recherche des commandes…";
    try {
      /* Lecture de toute la collection, comme l'import : les numéros sont
         stockés sous des formes variables selon l'ancienneté des commandes,
         une requête where sur le téléphone en manquerait. Le volume reste
         celui d'une boulangerie, et l'opération est ponctuelle. */
      const snap = await getDocs(collection(db, "commandes"));
      const mien = cleTel(c.telephone);
      const aRattacher = [];
      snap.forEach(docCmd => {
        const v = docCmd.data();
        if (v.compte_uid) return;                        // déjà rattachée
        if (cleTel(v.client?.telephone) !== mien) return;
        aRattacher.push(docCmd.id);
      });

      if (!confirm(`Rattacher ${ech(c.nom)} au compte ${email} ?\n\n` +
                   `${aRattacher.length} commande(s) apparaîtront dans son espace « My account ».\n` +
                   "L'e-mail sera aussi inscrit sur sa fiche, ce qui lie son solde et son tarif de groupe.")) {
        etatRattacher.textContent = "";
        btnRattacher.disabled = false;
        return;
      }

      // Par lots : writeBatch plafonne à 500 écritures.
      for (let i = 0; i < aRattacher.length; i += 400) {
        const lot = writeBatch(db);
        aRattacher.slice(i, i + 400).forEach(id =>
          lot.set(doc(db, "commandes", id), { compte_uid: compte.id }, { merge: true }));
        await lot.commit();
      }
      await setDoc(doc(db, "clients", c.id), { email }, { merge: true });
      c.email = email;

      etatRattacher.textContent = aRattacher.length
        ? `${aRattacher.length} commande(s) rattachée(s).`
        : "Compte rattaché. Aucune commande à reprendre.";
      champEmail.value = email;
      infoEmail.textContent = "— rattaché au compte boutique";
      zoneRattache.hidden = true;
      // Le tarif de groupe et le solde dépendent du compte : la fiche doit
      // être redessinée pour les afficher.
      afficher();
    } catch (e) {
      console.error(e);
      etatRattacher.textContent = "Échec — réessayez.";
      btnRattacher.disabled = false;
    }
  };

  /* ----- Groupe tarifaire, porté par le compte boutique ----- */
  const selTarif = d.querySelector(".c-tarif");
  const infoTarif = d.querySelector(".c-tarif-info");
  const groupesVus = [...new Set(GROUPES_TARIF.concat(cpt && cpt.groupe ? [cpt.groupe] : []))];
  groupesVus.forEach(g => {
    const o = document.createElement("option");
    o.value = g; o.textContent = g;
    selTarif.appendChild(o);
  });

  /* Champ purement indicatif : le groupe tarifaire se règle dans la page
     Crédit, seul endroit où la portée de la remise se règle aussi. Le
     modifier ici, sans sa portée, produirait des tarifs incohérents. */
  selTarif.disabled = true;
  if (!cpt) {
    selTarif.value = "";
    infoTarif.textContent = "— aucun compte boutique rattaché";
  } else {
    selTarif.value = cpt.groupe || "";
    infoTarif.textContent = "— lecture seule, se règle dans Crédit"
      + (cpt.remise > 0 ? " · remise en vigueur : " + cpt.remise + " %" : "");
  }

  /* ----- Archivage et suppression ----- */
  const btnArchiver = d.querySelector(".c-archiver");
  btnArchiver.textContent = c.archive ? "Réactiver la fiche" : "Archiver la fiche";
  btnArchiver.onclick = () => basculerArchive(c);

  const btnSupprimer = d.querySelector(".c-supprimer");
  // La suppression n'est offerte qu'aux fiches classées « Test » : il faut
  // avoir catégorisé la fiche pour pouvoir la détruire.
  if (estTest(c)) btnSupprimer.hidden = false;
  btnSupprimer.onclick = () => supprimerFiche(c);

  const noter = () => { modifies.add(c.id); majEtat(); };
  d.querySelector(".c-nom").oninput     = (e) => { c.nom = e.target.value; noter(); };
  d.querySelector(".c-groupe").oninput  = (e) => {
    c.groupe = e.target.value.trim();
    // Le bouton de suppression suit le segment sans attendre l'enregistrement.
    btnSupprimer.hidden = !estTest(c);
    noter();
  };
  d.querySelector(".c-adresse").oninput = (e) => { c.adresse = e.target.value; noter(); };
  /* Le motard appelle, il n'écrit pas sur WhatsApp. Quand le numéro de la
     fiche est étranger, c'est celui-ci que reçoit Lalamove. */
  d.querySelector(".c-tel-local").oninput = (e) => {
    c.telephone_local = e.target.value.trim();
    noter();
  };

  /* ----- Lien Maps, coordonnées et carte ----- */
  const etatMaps   = d.querySelector(".c-maps-etat");
  const ouvrirMaps = d.querySelector(".c-maps-ouvrir");
  const boiteCarte = d.querySelector(".c-carte");
  const boiteLala  = d.querySelector(".c-lala");
  const selDepart  = d.querySelector(".c-lala-depart");
  const btnCoter   = d.querySelector(".c-lala-coter");
  const etatCoter  = d.querySelector(".c-lala-etat");
  const btnCourse  = d.querySelector(".c-lala-courser");
  const etatCourse = d.querySelector(".c-lala-course-etat");

  /* Les départs ne sont demandés qu'à la première fiche géolocalisée ouverte :
     inutile d'appeler le serveur pour un client qui vient chercher son pain. */
  let departsCharges = false;
  function remplirDeparts() {
    if (departsCharges) return;
    departsCharges = true;
    lireLieuxLalamove().then(cfg => {
      const lieux = cfg.lieux || [];
      selDepart.innerHTML = lieux
        .map(l => '<option value="' + ech(l.cle) + '">' + ech(l.nom) + '</option>').join("");
      if (cfg.defaut) selDepart.value = cfg.defaut;
    }).catch(e => {
      console.error(e);
      etatCoter.style.color = "var(--alerte)";
      etatCoter.textContent = "Points de départ indisponibles.";
      departsCharges = false;
    });
  }

  let carte = null, repere = null;

  /* Format « place » avec coordonnées : Maps pose un repère exactement là,
     sans chercher l'établissement le plus proche — c'est ce que fait le
     format « search », et il tombe régulièrement sur le bâtiment voisin. */
  const lienExact = (lat, lng) =>
    "https://www.google.com/maps/place/" + lat + "," + lng +
    "/@" + lat + "," + lng + ",19z";

  /* La course consomme une cotation : quotationId + les deux stopId. Elle
     expire au bout de 5 minutes, d'où la mémorisation de l'heure. Une
     minute de marge est retirée : mieux vaut recoter pour rien que voir
     Lalamove refuser une réservation entre deux clics. */
  const VALIDITE_COTATION = 4 * 60 * 1000;
  let cotation = null, cotationLe = 0, armee = 0;

  function oublierCotation() {
    cotation = null; cotationLe = 0;
    desarmer();
    btnCourse.hidden = true;
    etatCourse.textContent = "";
  }

  function cotationFraiche() {
    return cotation && (Date.now() - cotationLe) < VALIDITE_COTATION;
  }

  function desarmer() {
    armee = 0;
    btnCourse.textContent = "Commander la course";
    btnCourse.style.borderColor = "var(--alerte)";
    btnCourse.style.color = "var(--alerte)";
    btnCourse.style.background = "";
  }

  const rendreEtatMaps = () => {
    const co = c.coordonnees;
    if (co && co.lat && co.lng) {
      etatMaps.textContent = "— " + co.lat.toFixed(6) + ", " + co.lng.toFixed(6);
      etatMaps.style.color = "var(--ok)";
      ouvrirMaps.hidden = false;
      ouvrirMaps.href = lienExact(co.lat, co.lng);
    } else {
      etatMaps.textContent = "— aucune coordonnée";
      etatMaps.style.color = "var(--encre-doux)";
      ouvrirMaps.hidden = true;
    }
    /* Pas de coordonnées, pas de cotation : un bouton qui refuserait de
       fonctionner serait moins clair qu'un bouton absent. Les fiches sans
       point sont les clients en retrait, c'est un cas normal, pas un manque. */
    const cotable = !!(co && co.lat && co.lng);
    boiteLala.hidden = !cotable;
    // Le point a bougé : la cotation ne correspond plus, la course disparaît.
    if (!cotable && typeof oublierCotation === "function") oublierCotation();
    if (cotable) remplirDeparts();
  };
  rendreEtatMaps();

  /* Une cotation ne réserve rien et ne coûte rien : elle demande un prix.
     C'est la création de course, ailleurs, qui engagera de l'argent. */
  btnCoter.onclick = async () => {
    const co = c.coordonnees;
    if (!co || !co.lat || !co.lng) return;
    btnCoter.disabled = true;
    etatCoter.style.color = "var(--encre-doux)";
    etatCoter.textContent = "Cotation…";
    try {
      const r = await httpsCallable(fns, "lalamoveCotation")({
        lat: String(co.lat),
        lng: String(co.lng),
        adresse: c.adresse || "",
        depart: selDepart.value
      });
      const q = r.data;
      cotation = q; cotationLe = Date.now();
      btnCourse.hidden = false;
      desarmer();
      etatCourse.textContent = "";
      // L'heure est affichée parce qu'une cotation expire au bout de 5 minutes :
      // sans elle, un prix périmé serait indiscernable d'un prix frais.
      const heure = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
      const dist = q.distance ? (" · " + q.distance.value + " " + q.distance.unit) : "";
      etatCoter.style.color = "var(--ok)";
      etatCoter.textContent = (q.devise || "PHP") + " " + q.total
        + " · départ " + q.depart + dist + " · à " + heure;
    } catch (e) {
      console.error(e);
      etatCoter.style.color = "var(--alerte)";
      etatCoter.textContent = e && e.message ? e.message : "Cotation impossible.";
      oublierCotation();
    } finally {
      btnCoter.disabled = false;
    }
  };

  /* Déplacer le repère fait foi : le champ texte est réécrit pour rester
     cohérent avec le point réellement enregistré. */
  const poserPoint = (lat, lng, recentrer) => {
    c.coordonnees = { lat: lat, lng: lng };
    // Seul geste autorisé à écrire les coordonnées en base (voir l'enregistrement).
    c._pointPose = true;
    c.maps_url = lienExact(lat, lng);
    if (repere) repere.setLatLng([lat, lng]);
    if (carte && recentrer) carte.setView([lat, lng], Math.max(carte.getZoom(), 17));
    rendreEtatMaps();
    noter();
  };

  // Centre de repli quand le client n'a pas encore de point : Metro Manila.
  const CENTRE_DEFAUT = [14.5547, 121.0244];

  el._monterCarte = () => {
    if (carte) { setTimeout(() => carte.invalidateSize(), 0); return; }
    if (typeof L === "undefined") {
      boiteCarte.innerHTML = '<div class="vide">Carte indisponible (Leaflet non chargé).</div>';
      return;
    }
    const co = c.coordonnees;
    const depart = (co && co.lat && co.lng) ? [co.lat, co.lng] : CENTRE_DEFAUT;

    carte = L.map(boiteCarte).setView(depart, co ? 18 : 12);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "© OpenStreetMap"
    }).addTo(carte);

    repere = L.marker(depart, { draggable: true }).addTo(carte);
    repere.on("dragend", () => {
      const p = repere.getLatLng();
      poserPoint(p.lat, p.lng, false);
    });
    carte.on("click", (ev) => poserPoint(ev.latlng.lat, ev.latlng.lng, false));

    // Le conteneur était masqué à la construction : sans ce rappel, Leaflet
    // calcule une taille nulle et n'affiche qu'un fragment de carte.
    setTimeout(() => carte.invalidateSize(), 0);
  };

  /* Le champ de saisie du lien a été retiré : une frappe qui n'y produisait
     pas de coordonnées lisibles effaçait le point posé sur la carte, ce qui
     détruisait sans prévenir un vrai travail de géolocalisation. Le point se
     pose désormais uniquement sur la carte ou par la recherche d'adresse —
     deux gestes qui ne peuvent que le renseigner, jamais l'effacer.
     maps_url reste écrit en base : il n'alimente plus que « Ouvrir dans Maps ». */

  /* ----- Recherche d'adresse (Nominatim, sans clé ni compte) -----
     La machine propose, Yoann tranche : le résultat n'est jamais enregistré
     tel quel sans qu'il l'ait vu sur la carte. Les adresses de Manille sont
     trop mal référencées pour faire autrement. */
  const btnChercher  = d.querySelector(".c-chercher");
  const etatChercher = d.querySelector(".c-chercher-etat");

  btnChercher.onclick = async () => {
    const requete = (c.adresse || "").trim();
    if (!requete) { etatChercher.textContent = "Renseignez d'abord l'adresse."; return; }

    // La carte doit exister avant qu'on puisse y poser quoi que ce soit.
    el._monterCarte();

    btnChercher.disabled = true;
    etatChercher.textContent = "Recherche…";
    try {
      // « Metro Manila » ajouté d'office : sans lui, Nominatim part volontiers
      // sur une rue homonyme à l'autre bout du monde.
      const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q="
        + encodeURIComponent(requete + ", Metro Manila, Philippines");
      const r = await fetch(url, { headers: { "Accept": "application/json" } });
      const j = await r.json();

      if (!Array.isArray(j) || !j.length) {
        etatChercher.textContent = "Adresse introuvable — posez le point à la main.";
      } else {
        const lat = parseFloat(j[0].lat), lng = parseFloat(j[0].lon);
        poserPoint(lat, lng, true);
        etatChercher.textContent = "Point posé — vérifiez et ajustez si besoin.";
      }
    } catch (e) {
      console.error(e);
      etatChercher.textContent = "Recherche impossible.";
    } finally {
      // Nominatim n'accepte qu'une requête par seconde : le bouton attend.
      setTimeout(() => { btnChercher.disabled = false; }, 1100);
    }
  };

  /* Confirmation en deux temps plutôt qu'une fenêtre système : à 6h du matin
     on valide un confirm() sans le lire. Un bouton qui change de texte et
     affiche le prix oblige à regarder ce qu'on est en train d'engager. */
  btnCourse.onclick = async () => {
    if (!c.telephone) {
      etatCourse.style.color = "var(--alerte)";
      etatCourse.textContent = "Fiche sans téléphone : impossible de commander.";
      return;
    }

    // Premier clic : on arme, on affiche le prix, et on laisse 10 secondes.
    if (!armee || Date.now() > armee) {
      if (!cotationFraiche()) {
        etatCourse.style.color = "var(--encre-doux)";
        etatCourse.textContent = "Cotation expirée — réestimez le prix d'abord.";
        oublierCotation();
        return;
      }
      armee = Date.now() + 10000;
      btnCourse.textContent = "Confirmer : " + (cotation.devise || "PHP") + " "
        + cotation.total + " → " + (c.nom || c.telephone);
      btnCourse.style.background = "#f6e2de";
      etatCourse.style.color = "var(--encre-doux)";
      etatCourse.textContent = "Second clic dans les 10 secondes pour engager la course.";
      setTimeout(() => {
        if (armee && Date.now() > armee - 200) {
          desarmer();
          etatCourse.textContent = "Annulé — rien n'a été commandé.";
        }
      }, 10000);
      return;
    }

    // Second clic : point de non-retour.
    desarmer();
    btnCourse.disabled = true;
    etatCourse.style.color = "var(--encre-doux)";
    etatCourse.textContent = "Réservation…";
    try {
      const stops = cotation.stops || [];
      const r = await httpsCallable(fns, "lalamoveCourse")({
        quotationId: cotation.quotationId,
        stopIdDepart: stops[0] && stops[0].stopId,
        stopIdArrivee: stops[1] && stops[1].stopId,
        nomClient: c.nom || c.telephone,
        telClient: c.telephone,
        consignes: (c.adresse || "").slice(0, 200)
      });
      const o = r.data;
      etatCourse.style.color = "var(--ok)";
      etatCourse.textContent = "Course " + o.orderId + " · " + o.statut
        + (o.traceEcrite ? "" : " · trace non enregistrée");
      if (o.partageUrl) {
        const a = document.createElement("a");
        a.className = "lien"; a.target = "_blank"; a.rel = "noopener";
        a.href = o.partageUrl; a.textContent = "Suivre";
        a.style.marginLeft = "9px";
        etatCourse.after(a);
      }
      // La cotation est consommée : la réutiliser créerait un doublon payant.
      cotation = null; cotationLe = 0;
      btnCourse.hidden = true;
    } catch (e) {
      console.error(e);
      etatCourse.style.color = "var(--alerte)";
      etatCourse.textContent = e && e.message ? e.message : "Réservation impossible.";
      btnCourse.disabled = false;
    }
  };

  d.querySelector(".c-notes").oninput   = (e) => { c.notes = e.target.value; noter(); };

  return el;
}

/* Le groupe tarifaire s'écrit tout de suite sur le compte, en fusion : cette
   page ne gère ni le solde ni les mouvements, elle ne doit rien en écraser. */
async function enregistrerTarif(c, cpt, sel, info) {
  const groupe = sel.value;
  sel.disabled = true;
  try {
    await setDoc(doc(db, "comptes", cpt.id), { groupe }, { merge: true });
    cpt.groupe = groupe;
    etat("Groupe tarifaire de " + (c.nom || c.telephone) + " : " + (groupe || "aucun") + ".", "ok");
    if (info && cpt.remise > 0 && !groupe) {
      info.textContent = "— remise individuelle conservée : " + cpt.remise + " %";
    }
  } catch (e) {
    console.error(e);
    sel.value = cpt.groupe || "";
    etat("Le groupe tarifaire n'a pas pu être enregistré.", "err");
  } finally {
    sel.disabled = false;
  }
}

/* L'archivage sort la fiche des listes sans toucher à son historique :
   c'est la bonne réponse pour un client parti, la suppression ne l'est pas. */
async function basculerArchive(c) {
  const versArchive = !c.archive;
  if (versArchive && !confirm(
    "Archiver la fiche de " + (c.nom || c.telephone) + " ?\n\n" +
    "Elle disparaîtra des listes courantes. Ses commandes et son historique sont conservés, " +
    "et la fiche reste consultable en cochant « Archivés et tests »."))
    return;
  try {
    await setDoc(doc(db, "clients", c.id), { archive: versArchive }, { merge: true });
    c.archive = versArchive;
    afficher();
    etat(versArchive ? "Fiche archivée." : "Fiche réactivée.", "ok");
  } catch (e) {
    console.error(e);
    etat("L'archivage a échoué.", "err");
  }
}

/* Suppression définitive, réservée aux fiches de test. On ne touche qu'à la
   fiche : les commandes éventuelles resteraient orphelines, donc on prévient
   quand il y en a. */
async function supprimerFiche(c) {
  if (!estTest(c)) {
    etat("Seules les fiches classées « Test » peuvent être supprimées.", "err");
    return;
  }
  let message = "Supprimer définitivement la fiche de " + (c.nom || c.telephone) + " ?\n\n" +
    "Cette action est irréversible.";
  if (c.nb_commandes > 0) {
    message += "\n\n⚠️ Cette fiche compte " + c.nb_commandes + " commande(s) pour " +
      peso(c.total_depense) + ". Les commandes ne seront pas supprimées et " +
      "n'auront plus de fiche client rattachée.";
  }
  const cpt = compteDe(c);
  if (cpt && cpt.solde !== 0) {
    message += "\n\n⚠️ Un compte boutique au même numéro porte un solde de " +
      peso(cpt.solde) + ". Il n'est pas supprimé.";
  }
  if (!confirm(message)) return;

  try {
    await deleteDoc(doc(db, "clients", c.id));
    clients = clients.filter(x => x.id !== c.id);
    modifies.delete(c.id);
    majGroupes();
    afficher();
    majEtat();
    etat("Fiche supprimée.", "ok");
  } catch (e) {
    console.error(e);
    etat("La suppression a échoué.", "err");
  }
}

function majEtat() {
  etat(modifies.size
    ? modifies.size + " fiche(s) modifiée(s) — pensez à enregistrer"
    : "");
}

/* ---------- Enregistrement ---------- */
$("btnEnregistrer").onclick = async () => {
  if (!modifies.size) return etat("Rien à enregistrer.", "ok");
  $("btnEnregistrer").disabled = true;
  etat("Enregistrement…");
  try {
    const paquet = writeBatch(db);
    clients.filter(c => modifies.has(c.id)).forEach(c => {
      /* merge:true, et ce n'est pas un détail de style.
         Sans lui, ce set remplaçait le document ENTIER par la liste
         ci-dessous : tout champ oublié ici était effacé en base, sans
         message ni trace. C'est ainsi que les tags ont disparu.
         Avec merge, un champ absent de la liste est simplement laissé
         tel quel. Ajouter un champ à la fiche sans penser à cette liste
         ne peut plus rien détruire. */
      const champs = {
        nom: c.nom, telephone: c.telephone,
        telephone_local: c.telephone_local || "", adresse: c.adresse,
        // Collecté depuis les commandes, jamais saisi : on le réécrit tel
        // quel plutôt que de le laisser au hasard d'une lecture partielle.
        email: c.email || "",
        groupe: c.groupe, tags: c.tags, notes: c.notes,
        archive: !!c.archive,
        nb_commandes: c.nb_commandes, total_depense: c.total_depense,
        derniere_commande: c.derniere_commande
      };

      /* Les coordonnées ne sont écrites que si un point a été posé sur la
         carte pendant cette session. Sans ce drapeau, enregistrer une fiche
         pour changer une note réécrirait aussi le point — et le jour où la
         copie en mémoire est incomplète, il part à la poubelle sans bruit.
         Modifier une adresse ne peut donc plus rien détruire. */
      if (c._pointPose && c.coordonnees) {
        champs.coordonnees = c.coordonnees;
        champs.maps_url = c.maps_url || "";
      }

      paquet.set(doc(db, "clients", c.id), champs, { merge: true });
    });
    await paquet.commit();
    modifies.clear();
    majGroupes();
    afficher();
    etat("Enregistré.", "ok");
  } catch (e) {
    console.error(e);
    etat("L'enregistrement a échoué.", "err");
  } finally {
    $("btnEnregistrer").disabled = false;
  }
};

function etat(texte, type = "") {
  $("etat").textContent = texte;
  $("etat").className = "etat " + type;
}

// Alimentée d'abord par les segments réellement utilisés (appelée depuis
// afficher(), donc dès le chargement des clients) — complétée en direct
// par ce que l'admin est en train de taper ailleurs, pour proposer aussi
// un segment tout juste créé sans avoir à recharger. Doit rester dans ce
// module : elle lit `clients`, qui n'existe que dans cette portée.
function majSuggestionsGroupes() {
  const dl = document.getElementById('groupesConnus');
  if (!dl) return;
  const saisis = [...document.querySelectorAll('.c-groupe')]
    .map(i => i.value.trim()).filter(Boolean);
  const existants = clients.map(c => c.groupe).filter(Boolean);
  dl.innerHTML = [...new Set(['Test', ...existants, ...saisis])]
    .map(g => `<option value="${g}">`).join('');
}
document.addEventListener('input', majSuggestionsGroupes);
</script>

<datalist id="groupesConnus"></datalist>
</body>
</html>
