<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calcul Prix de Revient - Tous Produits (₱)</title>
<style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fdf6ec; color: #3b2c1a; padding: 20px; margin: 0; }
    h1 { color: #7a4a1f; font-size: 1.4rem; margin-bottom: 5px; }
    p { font-size: 0.85rem; color: #6b5b45; margin-bottom: 15px; }
    .carte { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 15px; max-width: 900px; margin-bottom: 20px; }
    .produit-bloc { border: 1px solid #e0d3bd; border-radius: 8px; padding: 12px; margin-bottom: 15px; background: #faf5ed; }
    .produit-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .code-produit { font-family: ui-monospace, monospace; font-size: 0.8em; background: #efe0c8; color: #7a4a1f; padding: 5px 8px; border-radius: 4px; font-weight: bold; letter-spacing: 0.03em; }
    .produit-titre { font-weight: bold; font-size: 1.1em; color: #7a4a1f; flex-grow: 1; border: 1px solid #ccc; padding: 5px; border-radius: 4px; background: #fff; min-width: 150px; }
    .nb-pieces-input { width: 80px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
    table { border-collapse: collapse; width: 100%; font-size: 0.85em; background: #fff; margin-bottom: 8px; }
    th, td { border: 1px solid #e0d3bd; padding: 6px; text-align: center; }
    th { background: #7a4a1f; color: #fff; }
    select, input[type="number"] { padding: 4px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .resume-produit { display: flex; justify-content: space-between; align-items: center; font-weight: bold; margin-top: 8px; font-size: 0.9em; }
    .badge-cout { background: #e8f8f5; color: #27ae60; padding: 4px 8px; border-radius: 4px; font-size: 1.05em; }
    .btn { background: #7a4a1f; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85em; font-weight: bold; margin-right: 5px; }
    .btn-dup { background: #2980b9; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85em; }
    .btn-add-ingred { background: #efe0c8; color: #7a4a1f; border: 1px solid #7a4a1f; padding: 4px 8px; font-size: 0.8em; margin-top: 5px; }
    .btn-sup { background: #c0392b; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
    .status-bar { background: #efe0c8; padding: 8px 12px; border-radius: 6px; margin-bottom: 15px; font-size: 0.85em; font-weight: bold; color: #7a4a1f; }
/* Ajouter une marge de sécurité au bas de la page */
body {
    padding-bottom: 70px !important;
}</style>

<!-- Firebase SDK Compat Version -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

<h1>💰 Calcul du Prix de Revient Matière</h1>
<div class="status-bar" id="statusBar">🔄 Synchronisation avec Firebase...</div>

<button class="btn" onclick="ajouterProduit()">+ Ajouter un nouveau produit / viennoiserie</button>
<button class="btn" style="background:#27ae60;" onclick="sauvegarderCloud()">☁️ Enregistrer les recettes sur Firebase</button>

<div id="conteneurProduits" style="margin-top:15px;"></div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyDuq8KS8M_Z8U7BlSp6MvE-6Y9OYYaDujE",
      authDomain: "bakertools-ae124.firebaseapp.com",
      projectId: "bakertools-ae124",
      storageBucket: "bakertools-ae124.firebasestorage.app",
      messagingSenderId: "978584667113",
      appId: "1:978584667113:web:868cc89788aff27717c178",
      measurementId: "G-KQNS7J2NPX"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function formatPeso(nombre) {
        return "₱ " + nombre.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    let masterIngredients = [];
    let fichesProduits = [];

    function initialiserEcouteurs() {
        // Écoute dynamique des ingrédients (se rafraîchit dès que le client repasse en ligne)
        db.collection("ingredients").doc("master").onSnapshot({ includeMetadataChanges: true }, (doc) => {
            if (doc.exists && doc.data().items) {
                masterIngredients = doc.data().items;
            } else {
                masterIngredients = [
                    { nom: "Farine de blé", type: "kg", prix: 45 },
                    { nom: "Beurre", type: "kg", prix: 380 },
                    { nom: "Sucre", type: "kg", prix: 60 },
                    { nom: "Sel", type: "kg", prix: 25 }
                ];
            }
            afficherFiches();
        }, (err) => {
            console.log("Attente réseau ingrédients : " + err.message);
        });

        // Écoute dynamique des recettes
        db.collection("recettes").doc("fiches").onSnapshot({ includeMetadataChanges: true }, (doc) => {
            if (doc.exists && doc.data().items) {
                fichesProduits = doc.data().items;
                document.getElementById('statusBar').textContent = "✅ Connecté & Synchronisé avec Firebase";
            } else {
                fichesProduits = [{ nom: "Croissant", nbPieces: 10, ingredients: [{ nom: "Farine de blé", qte: 500 }, { nom: "Beurre", qte: 250 }] }];
            }
            afficherFiches();
        }, (err) => {
            document.getElementById('statusBar').textContent = "⚡ Mode Hors-Ligne (Données locales affichées)";
            afficherFiches();
        });
    }

    function afficherFiches() {
        const conteneur = document.getElementById('conteneurProduits');
        conteneur.innerHTML = '';

        fichesProduits.forEach((prod, pIdx) => {
            const bloc = document.createElement('div');
            bloc.className = 'carte produit-bloc';

            let lignesHTML = '';
            let coutTotalRecette = 0;

            prod.ingredients.forEach((ing, iIdx) => {
                const infoIngred = masterIngredients.find(m => m.nom.toLowerCase() === ing.nom.toLowerCase());
                const prixUnitaire = infoIngred ? infoIngred.prix : 0;
                const typeUnite = infoIngred ? infoIngred.type : 'kg';

                const coutLigne = typeUnite === 'kg' ? (ing.qte / 1000) * prixUnitaire : ing.qte * prixUnitaire;
                coutTotalRecette += coutLigne;

                let optionsIngred = masterIngredients.map(m => 
                    `<option value="${m.nom}" ${m.nom.toLowerCase() === ing.nom.toLowerCase() ? 'selected' : ''}>${m.nom} (${m.prix} ₱/${m.type})</option>`
                ).join('');

                lignesHTML += `
                    <tr>
                        <td style="text-align:left;">
                            <select onchange="modifierIngredNom(${pIdx}, ${iIdx}, this.value)">
                                ${optionsIngred}
                            </select>
                        </td>
                        <td>
                            <input type="number" step="0.1" value="${ing.qte}" onchange="modifierIngredQte(${pIdx}, ${iIdx}, parseFloat(this.value)||0)" style="width:70px;"> 
                            ${typeUnite === 'kg' ? 'g' : 'unité(s)'}
                        </td>
                        <td>${formatPeso(coutLigne)}</td>
                        <td><button class="btn-sup" onclick="supprimerIngred(${pIdx}, ${iIdx})">X</button></td>
                    </tr>
                `;
            });

            const coutUnitaire = prod.nbPieces > 0 ? (coutTotalRecette / prod.nbPieces) : 0;

            bloc.innerHTML = `
                <div class="produit-header">
                    <span class="code-produit" title="Référence interne — ne change jamais">${prod.id || '—'}</span>
                    <input type="text" class="produit-titre" value="${prod.nom}" onchange="modifierNomProduit(${pIdx}, this.value)">
                    <label style="font-size:0.85em;">Pièces: 
                        <input type="number" min="1" class="nb-pieces-input" value="${prod.nbPieces}" onchange="modifierNbPieces(${pIdx}, parseInt(this.value)||1)">
                    </label>
                    <button class="btn-dup" onclick="dupliquerProduit(${pIdx})">📋 Dupliquer</button>
                    <button class="btn-sup" onclick="supprimerProduit(${pIdx})">🗑️ Supprimer</button>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>Ingrédient</th>
                            <th>Quantité pour la recette</th>
                            <th>Coût (₱)</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>${lignesHTML}</tbody>
                </table>

                <button class="btn btn-add-ingred" onclick="ajouterIngred(${pIdx})">+ Ajouter un ingrédient</button>

                <div class="resume-produit">
                    <span>Coût total recette : ${formatPeso(coutTotalRecette)}</span>
                    <span>Coût matière par pièce : <span class="badge-cout">${formatPeso(coutUnitaire)}</span></span>
                </div>
            `;

            conteneur.appendChild(bloc);
        });
    }

    function modifierNomProduit(pIdx, val) { fichesProduits[pIdx].nom = val; }
    function modifierNbPieces(pIdx, val) { fichesProduits[pIdx].nbPieces = val; afficherFiches(); }
    function modifierIngredNom(pIdx, iIdx, val) { fichesProduits[pIdx].ingredients[iIdx].nom = val; afficherFiches(); }
    function modifierIngredQte(pIdx, iIdx, val) { fichesProduits[pIdx].ingredients[iIdx].qte = val; afficherFiches(); }

    function dupliquerProduit(pIdx) {
        const source = fichesProduits[pIdx];
        const copie = {
            nom: source.nom + " (Copie)",
            nbPieces: source.nbPieces,
            ingredients: JSON.parse(JSON.stringify(source.ingredients))
        };
        fichesProduits.splice(pIdx + 1, 0, copie);
        afficherFiches();
    }

    function ajouterProduit() {
        const premierIngred = masterIngredients.length > 0 ? masterIngredients[0].nom : "Farine de blé";
        fichesProduits.push({ nom: "Nouveau produit", nbPieces: 1, ingredients: [{ nom: premierIngred, qte: 100 }] });
        afficherFiches();
    }

    function supprimerProduit(pIdx) {
        if (confirm("Supprimer ce produit ?")) {
            fichesProduits.splice(pIdx, 1);
            afficherFiches();
        }
    }

    function ajouterIngred(pIdx) {
        const premierIngred = masterIngredients.length > 0 ? masterIngredients[0].nom : "Farine de blé";
        fichesProduits[pIdx].ingredients.push({ nom: premierIngred, qte: 0 });
        afficherFiches();
    }

    function supprimerIngred(pIdx, iIdx) {
        fichesProduits[pIdx].ingredients.splice(iIdx, 1);
        afficherFiches();
    }

    async function sauvegarderCloud() {
        try {
            // On relit la version du serveur : la copie en mémoire peut être
            // périmée (page restée ouverte, passage hors-ligne), et l'écrire
            // telle quelle effacerait les champs ajoutés entre-temps.
            const snap = await db.collection("recettes").doc("fiches").get({ source: "server" });
            const distants = (snap.exists && snap.data().items) ? snap.data().items : [];

            const parId  = {};
            const parNom = {};
            distants.forEach(d => {
                if (d.id) parId[d.id] = d;
                if (d.nom) parNom[d.nom.trim().toLowerCase()] = d;
            });

            const aEcrire = fichesProduits.map(local => {
                const distant = (local.id && parId[local.id])
                    || (local.nom && parNom[local.nom.trim().toLowerCase()])
                    || {};
                // Les champs que cette page ne gère pas (id, et tout ce qui
                // viendra plus tard) sont repris du serveur.
                return Object.assign({}, distant, local, {
                    id: local.id || distant.id || undefined
                });
            }).map(o => {
                if (o.id === undefined) delete o.id;
                return o;
            });

            const perdus = distants.filter(d => d.id &&
                !aEcrire.some(o => o.id === d.id)).length;
            if (perdus && !confirm(perdus + " fiche(s) présente(s) sur le serveur ne figurent pas ici et seront supprimées.\n\nContinuer ?")) return;

            await db.collection("recettes").doc("fiches").set({ items: aEcrire });
            fichesProduits = aEcrire;
            alert("Recettes enregistrées et synchronisées !");
        } catch (err) {
            alert("Erreur d'enregistrement : " + err.message);
        }
    }

    window.addEventListener('DOMContentLoaded', initialiserEcouteurs);
</script>

</body>
</html>
