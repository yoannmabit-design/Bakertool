<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commandes — Yoann's French Bakery</title>
<meta name="theme-color" content="#1a1a1a">
<link rel="icon" href="logo.png" type="image/png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --creme:#fdf6ec;--papier:#fffdf9;--encre:#1f1b16;
    --encre-doux:#6b6157;--trait:#e2d7c6;--accent:#2f4858;
    --alerte:#8c2f22;--ok:#3d6b3d;--r:6px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--creme);color:var(--encre);
    font:18px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  header{
    background:var(--encre);color:var(--creme);padding:14px 18px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    position:sticky;top:0;z-index:5;
  }
  header h1{font-size:19px;margin:0;font-weight:600}
  header .qui{margin-left:auto;font-size:14.5px;opacity:.72}
  header button{
    background:transparent;border:1px solid #4a443c;color:var(--creme);
    padding:8px 13px;border-radius:var(--r);font-size:15px;cursor:pointer;
  }
  main{max-width:820px;margin:0 auto;padding:20px 16px 120px}

  .filtres{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}
  .filtres button{
    border:1px solid var(--trait);background:transparent;color:var(--encre-doux);
    padding:8px 15px;border-radius:var(--r);font-size:16px;cursor:pointer;
  }
  .filtres button[aria-pressed="true"]{
    background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;
  }

  .jour{font-size:16px;color:var(--encre-doux);margin:22px 0 9px;font-weight:600}
  .cmd{
    background:var(--papier);border:1px solid var(--trait);
    border-radius:var(--r);padding:14px;margin-bottom:10px;
  }
  .cmd.impaye{border-left:4px solid var(--alerte)}
  .cmd.reglee{border-left:4px solid var(--ok)}
  .tete{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;cursor:pointer}
  .tete .ref{font-family:ui-monospace,monospace;font-size:14.5px;color:var(--encre-doux)}
  .tete .nom{font-weight:600;flex:1;min-width:120px}
  .tete .montant{font-weight:600;font-variant-numeric:tabular-nums}
  .resume{font-size:15px;color:var(--encre-doux);margin-top:4px}

  .detail{margin-top:13px;padding-top:13px;border-top:1px dashed var(--trait)}
  .detail[hidden]{display:none}
  .detail .l{display:flex;justify-content:space-between;gap:12px;font-size:16.5px;padding:2px 0}
  .info{font-size:16px;color:var(--encre-doux);margin:3px 0}
  .info b{color:var(--encre);font-weight:600}

  .actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:14px}
  select{
    padding:9px 10px;border:1px solid var(--trait);border-radius:var(--r);
    background:#fff;font:inherit;font-size:16.5px;color:var(--encre);
  }
  .lien{
    display:inline-block;padding:9px 14px;border:1px solid var(--trait);
    border-radius:var(--r);text-decoration:none;color:var(--accent);font-size:16px;
  }
  .etiq{
    font-size:13px;letter-spacing:.07em;text-transform:uppercase;
    padding:3px 8px;border-radius:3px;background:#efe6d8;color:var(--encre-doux);
  }
  .etiq.rouge{background:#f6e2de;color:var(--alerte)}
  .etiq.verte{background:#e2eede;color:var(--ok)}
  .etiq.bleue{background:#dfe8ee;color:var(--accent)}

  /* Une couleur par statut, du plus froid au plus chaud : la commande
     avance vers le pain prêt, puis s'éteint une fois remise. */
  .etiq.st-nouvelle      {background:#e6e3f0;color:#4a4270}
  .etiq.st-confirmee     {background:#dfe8ee;color:#2d5771}
  .etiq.st-production    {background:#fbead2;color:#8a5a1c}
  .etiq.st-prete         {background:#e2eede;color:#33632f}
  .etiq.st-remise        {background:#eae6df;color:#6d665c}
  .etiq.st-annulee       {background:#f6e2de;color:var(--alerte);
                          text-decoration:line-through}

  /* Le même code couleur en filet à gauche de la carte : la liste se lit
     d'un coup d'œil sans avoir à relire chaque étiquette. */
  .cmd{border-left:3px solid transparent}
  .cmd.b-nouvelle   {border-left-color:#8b83b5}
  .cmd.b-confirmee  {border-left-color:#5b8bab}
  .cmd.b-production {border-left-color:#d09a3f}
  .cmd.b-prete      {border-left-color:#5f9257}
  .cmd.b-remise     {border-left-color:#c3bcb0}
  .cmd.b-annulee    {border-left-color:#c1705f}

  /* Confirmée ET payée : rien à faire sur cette commande. Le filet vert vif
     l'emporte sur la couleur de statut — c'est la combinaison des deux qui
     compte, pas l'un ou l'autre séparément. Un balayage du regard suffit :
     ce qui est vert est réglé, tout le reste demande quelque chose. */
  .cmd.rien-a-faire{border-left-color:#00c853;border-left-width:4px}

  /* ---------- Modification d'une commande ---------- */
  /* Ces deux classes n'existaient pas dans cette page : l'écran de
     modification est le premier à avoir de vrais boutons d'action. */
  .action{
    background:var(--accent);color:#fff;border:none;padding:10px 18px;
    border-radius:var(--r);font:inherit;font-size:16.5px;font-weight:600;cursor:pointer;
  }
  .action:disabled{opacity:.5;cursor:default}
  .mineur{
    background:none;border:1px solid var(--trait);color:var(--accent);
    padding:9px 14px;border-radius:var(--r);font:inherit;font-size:16px;cursor:pointer;
  }
  .edition{
    margin-top:14px;padding-top:14px;border-top:1px dashed var(--trait);
  }
  .edition .edit-l{
    display:flex;align-items:center;gap:9px;padding:6px 0;
    border-bottom:1px solid var(--trait);
  }
  .edition .edit-l .n{flex:1;font-size:16.5px}
  .edition .edit-l .q{
    width:62px;padding:6px 8px;border:1px solid var(--trait);
    border-radius:var(--r);font:inherit;font-size:16.5px;text-align:center;
  }
  .edition .edit-l .p{
    min-width:74px;text-align:right;font-variant-numeric:tabular-nums;font-size:16.5px;
  }
  .edition .edit-l .retirer{
    background:none;border:none;color:var(--alerte);
    font-size:17px;cursor:pointer;padding:4px 6px;
  }
  .edition .edit-vide{
    padding:10px 0;color:var(--alerte);font-size:16px;
  }
  .edition .edit-ajout{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .edition .edit-ajout select{
    flex:1;min-width:150px;padding:8px 10px;border:1px solid var(--trait);
    border-radius:var(--r);background:#fff;font:inherit;font-size:16.5px;
  }
  .edition .edit-ajout .edit-qte{
    width:70px;padding:8px;border:1px solid var(--trait);
    border-radius:var(--r);font:inherit;font-size:16.5px;text-align:center;
  }
  .edition .edit-date{
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:14px;
  }
  .edition .edit-date label{font-size:15px;color:var(--encre-doux)}
  .edition .edit-date input{
    padding:8px 10px;border:1px solid var(--trait);border-radius:var(--r);
    font:inherit;font-size:16.5px;
  }
  .edition .edit-avertit{font-size:14.5px;color:var(--alerte);flex:1;min-width:150px}
  .edition .edit-bilan{margin-top:14px;font-size:16.5px}
  .edition .edit-bilan .l{
    display:flex;justify-content:space-between;gap:12px;padding:3px 0;
  }
  .edition .edit-bilan .l.somme{
    border-top:1px solid var(--trait);margin-top:6px;padding-top:7px;font-weight:600;
  }
  .edition .edit-bilan .l.ecart{color:var(--alerte);font-weight:600}
  .edition .edit-alerte{
    margin-top:10px;padding:10px 12px;border-radius:var(--r);
    background:#f6e2de;color:var(--alerte);font-size:15px;line-height:1.45;
  }
  .edition .edit-actions{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}

  .coche{width:19px;height:19px;flex-shrink:0;accent-color:var(--accent);cursor:pointer}
  .jour{display:flex;align-items:center;gap:10px}
  .jour .tout{
    font-size:14px;color:var(--accent);background:none;border:none;
    cursor:pointer;text-decoration:underline;padding:0;font-weight:400;
  }
  .lot{
    position:fixed;left:0;right:0;bottom:0;background:var(--encre);color:var(--creme);
    padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    transform:translateY(120%);transition:transform .18s ease;z-index:6;
  }
  .lot.vu{transform:translateY(0)}
  .lot .n{font-weight:600;margin-right:auto}
  .lot select{font-size:16px;padding:8px 9px}
  .lot .appliquer{
    background:var(--creme);color:var(--encre);border:none;padding:10px 16px;
    border-radius:var(--r);font-size:16.5px;font-weight:600;cursor:pointer;
  }
  .lot .appliquer:disabled{opacity:.45;cursor:default}
  .lot .annuler{
    background:transparent;border:1px solid #4a443c;color:var(--creme);
    padding:9px 13px;border-radius:var(--r);font-size:16px;cursor:pointer;
  }
  .lot .danger{
    background:transparent;border:1px solid #a8503f;color:#f0a795;
    padding:9px 13px;border-radius:var(--r);font-size:16px;cursor:pointer;
  }

  /* Couleur des menus de statut : l'état d'une commande se lit de loin,
     sans avoir à déplier la carte. */
  select[data-v]{font-weight:600}
  select[data-v="nouvelle"]     {color:#8c2f22;border-color:#d9a79c}
  select[data-v="confirmee"]    {color:#2f4858;border-color:#a9bcc7}
  select[data-v="en production"]{color:#8a5a12;border-color:#dcbe8a}
  select[data-v="prete"]        {color:#3d6b3d;border-color:#a9c7a9}
  select[data-v="remise"]       {color:#6b6157;border-color:var(--trait)}
  select[data-v="annulee"]      {color:#9a9188;border-color:var(--trait)}
  select[data-v="en attente"]   {color:#8c2f22;border-color:#d9a79c}
  select[data-v="paye"]         {color:#3d6b3d;border-color:#a9c7a9}
  select[data-v="rembourse"]    {color:#6b6157;border-color:var(--trait)}
  .vide{padding:44px;text-align:center;color:var(--encre-doux)}
  .connexion{max-width:400px;margin:14vh auto;text-align:center;padding:0 20px}
  .connexion h1{font-size:25px;margin:0 0 20px}
  .connexion button{
    background:var(--accent);color:#fff;border:none;padding:12px 22px;
    border-radius:var(--r);font-size:17px;font-weight:600;cursor:pointer;
  }
  .etat{
    position:fixed;bottom:84px;left:50%;transform:translateX(-50%);
    background:var(--encre);color:var(--creme);padding:10px 18px;
    border-radius:var(--r);font-size:16px;opacity:0;transition:opacity .2s;
  }
  .etat.vu{opacity:1}
  .etat.ok{background:#33632f}
  .etat.err{background:var(--alerte)}
</style>
</head>
<body>

<div id="ecranConnexion" class="connexion">
  <h1>Commandes</h1>
  <button id="btnConnexion">Se connecter avec Google</button>
  <p id="msgConnexion" style="margin-top:18px;font-size:16px"></p>
</div>

<div id="app" hidden>
  <header>
    <h1>Commandes</h1>
    <span class="qui" id="qui"></span>
    <button id="btnRecharger">Actualiser</button>
    <button id="btnDeconnexion">Quitter</button>
  </header>
  <main>
    <div class="filtres" id="filtres">
      <button data-f="actives" aria-pressed="true">À traiter</button>
      <button data-f="impayees" aria-pressed="false">Impayées</button>
      <button data-f="toutes" aria-pressed="false">Toutes</button>
    </div>
    <div id="liste"><div class="vide">Chargement…</div></div>
  </main>
</div>

<div class="lot" id="lot">
  <span class="n" id="lotN"></span>
  <select id="lotStatut">
    <option value="">Avancement…</option>
  </select>
  <select id="lotPaiement">
    <option value="">Paiement…</option>
  </select>
  <button class="appliquer" id="lotAppliquer" disabled>Appliquer</button>
  <button class="annuler" id="lotImprimer">Imprimer les étiquettes</button>
  <button class="danger" id="lotSupprimer">Supprimer</button>
  <button class="annuler" id="lotAnnuler">Annuler</button>
</div>

<div class="etat" id="etat"></div>

<script src="admin-nav.js" defer></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, getDoc, setDoc, updateDoc, writeBatch, increment }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
// Même règle de prix que la vitrine et le checkout : un article ajouté ici
// suit le tarif de groupe et le code promo exactement comme à la commande.
import { calculerPrix, prixUnitaire, rayonDe } from "./promo.js";

const firebaseConfig = {
  apiKey: "AIzaSyDuq8KS8M_Z8U7BlSp6MvE-6Y9OYYaDujE",
  authDomain: "bakertools-ae124.firebaseapp.com",
  projectId: "bakertools-ae124",
  storageBucket: "bakertools-ae124.firebasestorage.app",
  messagingSenderId: "978584667113",
  appId: "1:978584667113:web:868cc89788aff27717c178"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);
const $    = (id) => document.getElementById(id);
const peso = (n) => "₱" + Number(n || 0).toLocaleString("en-PH");

const STATUTS = ["nouvelle","confirmee","en production","prete","remise","annulee"];
const LIBELLES = {
  "nouvelle":"Nouvelle", "confirmee":"Confirmée", "en production":"En production",
  "prete":"Prête", "remise":"Remise", "annulee":"Annulée"
};
const PAIEMENTS = { "en attente":"En attente", "paye":"Payé", "rembourse":"Remboursé" };

// « en production » contient une espace : on la retire pour en faire une classe.
const CLASSE_STATUT = {
  "nouvelle":"nouvelle", "confirmee":"confirmee", "en production":"production",
  "prete":"prete", "remise":"remise", "annulee":"annulee"
};

// Portée de la génération des commandes d'abonnement, en jours.
const FENETRE_JOURS = 10;

let commandes = [], filtre = "actives";
let joursFermes = [];   // 0 = lundi
let catalogue = {};     // { code : { nom, prix_vente, rayon } } — pour la modification
let stockLimite = {};   // { code produit : true } — produits à stock décompté
let nomVersCode = {};   // rattrapage : nom du produit -> code, pour les commandes d'avant les codes
let abonnements = [];   // échéances d'abonnement à ajouter à la production
const selection = new Set();

/* ---------- Connexion ---------- */
$("btnConnexion").onclick = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) {
    $("msgConnexion").textContent = "Connexion impossible. Autorisez les fenêtres surgissantes.";
    console.error(e);
  }
};
$("btnDeconnexion").onclick = () => signOut(auth);
$("btnRecharger").onclick   = charger;

onAuthStateChanged(auth, async (user) => {
  if (!user) { $("app").hidden = true; $("ecranConnexion").hidden = false; return; }

  let autorise = false;
  try { autorise = (await getDoc(doc(db, "admins", user.uid))).exists(); }
  catch (e) { console.error(e); }

  if (!autorise) {
    await signOut(auth);
    $("msgConnexion").innerHTML =
      "Ce compte n'a pas accès.<br>Identifiant : <code>" + user.uid + "</code>";
    return;
  }
  $("ecranConnexion").hidden = true;
  $("app").hidden = false;
  $("qui").textContent = user.email;
  charger();
});

/* ---------- Chargement ---------- */
async function charger() {
  try {
    // Quels produits ont un stock à décompter ?
    try {
      const p = await getDoc(doc(db, "parametres", "boutique"));
      if (p.exists()) joursFermes = p.data().jours_fermes || [];
    } catch (e) { console.error(e); }

    try {
      const cat = await getDocs(collection(db, "boutique_produits"));
      stockLimite = {}; nomVersCode = {}; catalogue = {};
      cat.forEach(d => {
        const v = d.data();
        if (v.mode_stock === "limite") stockLimite[d.id] = true;
        if (v.nom) nomVersCode[cle(v.nom)] = d.id;
        catalogue[d.id] = {
          nom: v.nom || d.id,
          prix_vente: Number(v.prix_vente) || 0,
          rayon: rayonDe(v),
          publie: v.publie !== false
        };
      });
    } catch (e) { console.error(e); }

    try {
      const sa = await getDocs(collection(db, "abonnements"));
      abonnements = [];
      sa.forEach(d => abonnements.push({ id: d.id, ...d.data() }));
    } catch (e) {
      console.warn("Abonnements non lus (règles Firestore ?) :", e.message);
      abonnements = [];
    }

    const s = await getDocs(collection(db, "commandes"));
    commandes = [];
    s.forEach(d => commandes.push({ id: d.id, ...d.data() }));
    // Les plus proches en premier, puis les plus récemment reçues.
    commandes.sort((a, b) =>
      (a.date_retrait || "").localeCompare(b.date_retrait || "") ||
      (b.cree_le || "").localeCompare(a.cree_le || ""));
    const crees = await materialiserAbonnements();
    if (crees) {
      commandes.sort((a, b) =>
        (a.date_retrait || "").localeCompare(b.date_retrait || "") ||
        (b.cree_le || "").localeCompare(a.cree_le || ""));
      signaler(crees + " commande(s) d'abonnement générée(s).");
    }

    afficher();
    publierProduction();
    publierCharges();
  } catch (e) {
    console.error(e);
    $("liste").innerHTML = '<div class="vide">Les commandes n\'ont pas pu être chargées.</div>';
  }
}

/* ---------- Filtres ---------- */
$("filtres").onclick = (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  filtre = b.dataset.f;
  $("filtres").querySelectorAll("button").forEach(x =>
    x.setAttribute("aria-pressed", x === b));
  afficher();
};

function retenue(c) {
  if (filtre === "toutes") return true;
  if (filtre === "impayees")
    return (c.paiement?.statut || "en attente") === "en attente" && c.statut !== "annulee";
  return !["remise", "annulee"].includes(c.statut);
}

/* ---------- Affichage ---------- */
function afficher() {
  const liste = $("liste");
  const vues = commandes.filter(retenue);
  liste.innerHTML = "";

  if (!vues.length) {
    liste.innerHTML = '<div class="vide">Aucune commande dans cette vue.</div>';
    return;
  }

  // Une commande sortie de la vue ne doit pas rester sélectionnée en douce.
  const visibles = new Set(vues.map(c => c.id));
  [...selection].forEach(id => { if (!visibles.has(id)) selection.delete(id); });

  let jourCourant = null;
  vues.forEach(c => {
    if (c.date_retrait !== jourCourant) {
      jourCourant = c.date_retrait;
      const t = document.createElement("div");
      t.className = "jour";
      const duJour = vues.filter(x => x.date_retrait === jourCourant).map(x => x.id);
      const toutes = duJour.every(id => selection.has(id));
      t.innerHTML = '<span></span><button type="button" class="tout"></button>';
      t.querySelector("span").textContent = dateLongue(jourCourant);
      const bTout = t.querySelector(".tout");
      bTout.textContent = toutes ? "Tout désélectionner" : "Tout sélectionner";
      bTout.onclick = () => {
        duJour.forEach(id => toutes ? selection.delete(id) : selection.add(id));
        afficher();
      };
      liste.appendChild(t);
    }
    liste.appendChild(carte(c));
  });

  majLot();
}

function dateLongue(iso) {
  if (!iso) return "Sans date";
  const d = new Date(iso + "T12:00:00");
  const texte = d.toLocaleDateString("fr-FR",
    { weekday: "long", day: "numeric", month: "long" });
  const auj = new Date(); auj.setHours(0, 0, 0, 0);
  const ecart = Math.round((d - auj) / 86400000);
  if (ecart === 0) return "Aujourd'hui — " + texte;
  if (ecart === 1) return "Demain — " + texte;
  if (ecart < 0)   return "Passée — " + texte;
  return texte;
}

function carte(c) {
  const paye = (c.paiement?.statut || "en attente") === "paye";
  const el = document.createElement("div");
  // Confirmée et payée : la commande n'attend plus rien de vous.
  const rienAFaire = paye && ["confirmee", "en production", "prete", "remise"]
    .includes(c.statut);

  el.className = "cmd " + (paye ? "reglee" : "impaye") +
                 " b-" + (CLASSE_STATUT[c.statut] || "nouvelle") +
                 (rienAFaire ? " rien-a-faire" : "");

  const articles = (c.panier || []).reduce((n, l) => n + l.qte, 0);

  el.innerHTML = `
    <div class="tete">
      <input type="checkbox" class="coche" aria-label="Sélectionner">
      <span class="ref">${c.numero || c.id}</span>
      <span class="nom"></span>
      ${c.abonnement_id ? `<span class="etiq bleue">Abonnement${
        c.abonnement_rang ? " " + c.abonnement_rang +
          (c.abonnement_total ? "/" + c.abonnement_total : "") : ""}</span>` : ""}
      ${c.credit_utilise > 0 ? `<span class="etiq">crédit ${peso(c.credit_utilise)}</span>` : ""}
      <span class="etiq st-${CLASSE_STATUT[c.statut] || "nouvelle"}">${
        LIBELLES[c.statut] || c.statut}</span>
      <span class="etiq ${paye ? "verte" : "rouge"}">${paye ? "Payé" : "À encaisser"}</span>
      <span class="montant">${peso(c.total)}</span>
    </div>
    <div class="resume"></div>
    <div class="detail" hidden>
      <div class="lignes"></div>
      <p class="info" style="margin-top:11px"><b>Contact</b> ${c.client?.telephone || ""}</p>
      ${c.client?.adresse ? '<p class="info adresse"></p>' : ""}
      ${c.option?.lieu ? '<p class="info lieu"></p>' : ""}
      ${c.notes ? '<p class="info notes"></p>' : ""}
      <div class="actions">
        <select class="selStatut">
          ${STATUTS.map(s => `<option value="${s}">${LIBELLES[s]}</option>`).join("")}
        </select>
        <select class="selPaiement">
          ${Object.entries(PAIEMENTS).map(([v, t]) =>
            `<option value="${v}">${t}</option>`).join("")}
        </select>
        <a class="lien lienClient" target="_blank" rel="noopener">WhatsApp client</a>
        <button type="button" class="mineur btnModifier">Modifier la commande</button>
      </div>

      <div class="edition" hidden></div>
    </div>`;

  el.querySelector(".nom").textContent = c.client?.nom || "—";
  // Le statut est déjà dans l'étiquette colorée de l'en-tête.
  el.querySelector(".resume").textContent =
    [c.option?.nom, c.creneau,
     articles + (articles > 1 ? " articles" : " article")]
    .filter(Boolean).join(" · ");

  el.querySelector(".lignes").innerHTML = (c.panier || []).map(l =>
    `<div class="l"><span>${l.qte} × ${echapper(l.nom)}</span>
     <span>${peso(l.qte * l.prix)}</span></div>`).join("") +
    (c.frais_livraison > 0
      ? `<div class="l"><span>${echapper(c.option?.nom || "Livraison")}</span>
         <span>${peso(c.frais_livraison)}</span></div>` : "") +
    (c.frais_a_confirmer
      ? `<div class="l"><span>${echapper(c.option?.nom || "")}</span>
         <span>à confirmer</span></div>` : "");

  if (c.client?.adresse) el.querySelector(".adresse").textContent = c.client.adresse;
  if (c.option?.lieu)    el.querySelector(".lieu").textContent = c.option.lieu;
  if (c.notes)           el.querySelector(".notes").textContent = "Note : " + c.notes;

  const detail = el.querySelector(".detail");
  el.querySelector(".tete").onclick = () => { detail.hidden = !detail.hidden; };

  const coche = el.querySelector(".coche");
  coche.checked = selection.has(c.id);
  coche.onclick = (e) => e.stopPropagation();   // ne pas déplier la carte
  coche.onchange = () => {
    coche.checked ? selection.add(c.id) : selection.delete(c.id);
    majLot();
  };

  el.querySelector(".btnModifier").onclick = () => {
    const zone = el.querySelector(".edition");
    if (!zone.hidden) { zone.hidden = true; zone.innerHTML = ""; return; }
    ouvrirModification(c, el);
  };

  const selS = el.querySelector(".selStatut");
  const selP = el.querySelector(".selPaiement");
  selS.value = c.statut || "nouvelle";
  selP.value = c.paiement?.statut || "en attente";
  // La valeur est recopiée dans un attribut : le CSS ne peut pas cibler
  // la sélection courante d'un menu autrement.
  const teinter = (sel) => sel.dataset.v = sel.value;
  teinter(selS); teinter(selP);
  selS.onchange = () => { teinter(selS); enregistrer(c, { statut: selS.value }); };
  selP.onchange = () => { teinter(selP); enregistrer(c, { "paiement.statut": selP.value }); };

  el.querySelector(".lienClient").href =
    "https://wa.me/" + (c.client?.telephone || "").replace(/\D/g, "");

  return el;
}

function echapper(t) {
  return String(t ?? "").replace(/[&<>"]/g, x =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[x]));
}

/* ---------- Les échéances d'abonnement deviennent des commandes ----------
   Une échéance sans commande n'est ni imprimable, ni encaissable, ni suivable.
   L'identifiant est déterministe : relancer la génération ne crée pas de doublon. */
async function materialiserAbonnements() {
  // Fenêtre glissante : tout ce qui est dû d'ici dix jours est généré, ainsi
  // que les échéances en retard — une livraison due ne doit pas disparaître
  // parce que la page n'a pas été ouverte le bon jour.
  const limite = new Date(); limite.setHours(0, 0, 0, 0);
  limite.setDate(limite.getDate() + FENETRE_JOURS);
  const jusquA = iso(limite);

  // Chaque échéance à traiter est repérée par son rang dans le plan : c'est
  // ce rang, et non la date, qui fixe l'identifiant de la commande.
  const aFaire = [];
  abonnements.forEach(a => {
    if (a.statut !== "actif") return;
    (a.echeances || []).forEach((e, i) => {
      if (e.statut === "planifiee" && e.date && e.date <= jusquA)
        aFaire.push({ a, rang: i + 1, date: e.date });
    });
  });

  console.log("Abonnements :", abonnements.length,
    "· actifs :", abonnements.filter(a => a.statut === "actif").length,
    "· échéances jusqu'au " + jusquA + " :", aFaire.length);
  if (abonnements.length && !aFaire.length) {
    abonnements.forEach(a => console.log("  ", a.id, "statut", a.statut,
      "· échéances", (a.echeances || []).map(e => e.date + "/" + e.statut).join(" ")));
  }

  if (!aFaire.length) return 0;

  let creees = 0;
  for (const { a, rang, date } of aFaire) {
    // Rang sur deux chiffres : la commande garde le même identifiant même si
    // sa date est décalée ensuite, donc pas de doublon à la génération suivante.
    const id = "ABO-" + a.id + "-" + String(rang).padStart(2, "0");
    if (commandes.some(c => c.id === id)) continue;   // déjà générée

    const sousTotal = (a.panier || []).reduce((t, l) => t + (l.qte || 0) * (l.prix || 0), 0);
    const commande = {
      numero: "ABO-" + date.slice(5).replace("-", "") + "-" +
              (a.client?.nom || "").slice(0, 3).toUpperCase(),
      statut: "confirmee",
      abonnement_id: a.id,
      abonnement_rang: rang,
      abonnement_total: (a.echeances || []).length,
      client: {
        nom: a.client?.nom || "",
        telephone: a.client?.telephone || "",
        adresse: a.client?.adresse || ""
      },
      panier: (a.panier || []).map(l => ({ code: l.code, nom: l.nom, qte: l.qte, prix: l.prix })),
      sous_total: sousTotal,
      frais_livraison: Number(a.frais_livraison) || 0,
      frais_a_confirmer: false,
      total: sousTotal + (Number(a.frais_livraison) || 0),
      option: a.option || {},
      date_retrait: date,
      creneau: "",
      paiement: {
        methode: a.paiement?.mode === "credit" ? "credit" : "avance",
        statut: a.paiement?.mode === "credit" ? "en attente" : "paye"
      },
      notes: "Bread plan",
      cree_le: new Date().toISOString()
    };

    try {
      await setDoc(doc(db, "commandes", id), commande);
      commandes.push({ id, ...commande });
      creees += 1;
    } catch (e) {
      console.error("Génération de la commande d'abonnement", id, e);
    }
  }
  return creees;
}

/* ---------- Pont vers la production ----------
   Publie, pour la prochaine date de livraison, le total par code produit.
   Aucune donnée client : ce document est lisible par l'ERP sans risque. */
// Clé de rapprochement par nom, insensible aux accents et à la casse.
function cle(t) {
  return String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().replace(/[^a-z0-9]/g, "");
}

// Le code de la ligne, ou à défaut celui retrouvé d'après le nom du produit.
function codeLigne(l) {
  return l.code || nomVersCode[cle(l.nom)] || null;
}

function iso(d) {
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000)
    .toISOString().slice(0, 10);
}

function prochaineLivraison() {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  for (let i = 0; i < 14; i++) {
    if (!joursFermes.includes((d.getDay() + 6) % 7)) return iso(d);
    d.setDate(d.getDate() + 1);
  }
  return iso(new Date());
}

// Une commande entre en production dès qu'elle est confirmée par vous.
const RETENUS = ["confirmee", "en production", "prete"];

async function publierProduction() {
  try {
    const date = prochaineLivraison();
  const totaux = {}, noms = {};

  commandes
    .filter(c => c.date_retrait === date && RETENUS.includes(c.statut))
    .forEach(c => (c.panier || []).forEach(l => {
      const code = codeLigne(l);
      if (!code) { console.warn("Ligne sans code produit :", l.nom); return; }
      totaux[code] = (totaux[code] || 0) + (l.qte || 0);
      noms[code] = l.nom || code;
    }));

    const nbAbos = commandes.filter(c =>
      c.date_retrait === date && c.abonnement_id && RETENUS.includes(c.statut)).length;

    await setDoc(doc(db, "production", "commandes_boutique"), {
      date, totaux, noms,
      nb_commandes: commandes.filter(c => c.date_retrait === date && RETENUS.includes(c.statut)).length,
      nb_abonnements: nbAbos,
      maj: new Date().toISOString()
    });
    console.log("Production publiée :", date, totaux, "dont", nbAbos, "abonnement(s)");
  } catch (e) {
    console.error("Publication production", e);
    signaler("Publication vers l'ERP impossible.", "err");
  }
}


/* ---------- Charge de production ----------
   La vitrine ne peut pas additionner les commandes des autres clients :
   depuis les règles Firestore, chacun ne lit que les siennes. On publie donc,
   pour chaque jour à venir, ce qui est déjà commandé par produit — un document
   par date, en lecture publique.

   Le checkout incrémente ces compteurs au moment de la commande, mais c'est
   ici que se fait la vérité : à chaque ouverture de cette page, tout est
   recalculé depuis les commandes réelles. Un incrément manqué, une annulation,
   une modification à la main : tout se corrige tout seul.

   Attention au filtre : contrairement à la production, une commande reçue mais
   pas encore confirmée occupe déjà le four. Elle compte donc. */
const OCCUPANTS = ["nouvelle", "confirmee", "en production", "prete"];

// Deux inventaires identiques doivent produire le même texte, quel que soit
// l'ordre d'insertion des produits : sinon on réécrit pour rien.
function empreinte(produits) {
  return JSON.stringify(Object.keys(produits).sort().map(k => [k, produits[k]]));
}

async function publierCharges() {
  try {
    const aujourdhui = iso(new Date());

    // Un inventaire vide par jour de la fenêtre : les jours sans commande
    // doivent être publiés à zéro, sinon une annulation laisserait
    // l'ancienne charge en place.
    const parJour = {};
    for (let i = 0; i <= FENETRE_JOURS; i++) {
      const d = new Date();
      d.setDate(d.getDate() + i);
      parJour[iso(d)] = {};
    }

    commandes.forEach(c => {
      const jour = parJour[c.date_retrait];
      if (!jour || !OCCUPANTS.includes(c.statut)) return;
      (c.panier || []).forEach(l => {
        const code = codeLigne(l);
        if (!code) return;
        jour[code] = (jour[code] || 0) + (Number(l.qte) || 0);
      });
    });

    const s = await getDocs(collection(db, "charge"));
    const publie = {};
    s.forEach(d => publie[d.id] = d.data());

    const paquet = writeBatch(db);
    let ecrits = 0;

    Object.entries(parJour).forEach(([date, produits]) => {
      const avant = publie[date] ? (publie[date].produits || {}) : null;
      if (avant && empreinte(avant) === empreinte(produits)) return;   // inchangé
      paquet.set(doc(db, "charge", date),
                 { date, produits, maj: new Date().toISOString() });
      ecrits++;
    });

    // Les jours passés n'intéressent plus personne : on garde la collection courte.
    Object.keys(publie).forEach(date => {
      if (date < aujourdhui) { paquet.delete(doc(db, "charge", date)); ecrits++; }
    });

    if (ecrits) await paquet.commit();
    console.log("Charges publiées :", ecrits, "jour(s) mis à jour.");
  } catch (e) {
    console.error("Publication des charges", e);
    signaler("Publication des capacités impossible.", "err");
  }
}

/* ---------- Décompte du stock ----------
   Confirmer une commande retire ses pièces du stock ; l'annuler les rend.
   Le drapeau stock_deduit évite tout double décompte. */
function ajustementsStock(c, nouveauStatut) {
  const dejaDeduit = !!c.stock_deduit;
  const doitDeduire = nouveauStatut === "confirmee" && !dejaDeduit;
  const doitRendre  = nouveauStatut === "annulee" && dejaDeduit;
  if (!doitDeduire && !doitRendre) return null;

  const signe = doitDeduire ? -1 : 1;
  const lignes = (c.panier || [])
    .map(l => Object.assign({}, l, { code: codeLigne(l) }))
    .filter(l => l.code && stockLimite[l.code]);
  return { lignes, signe, drapeau: doitDeduire };
}

// Un crédit annoncé au checkout n'est réellement débité qu'à la confirmation,
// et restitué si la commande est annulée.
function appliquerCredit(paquet, c, nouveauStatut) {
  const montant = Number(c.credit_utilise) || 0;
  if (!montant || !c.compte_uid) return null;

  const deja = !!c.credit_deduit;
  const debiter = nouveauStatut === "confirmee" && !deja;
  const rendre  = nouveauStatut === "annulee" && deja;
  if (!debiter && !rendre) return null;

  const signe = debiter ? -1 : 1;
  paquet.set(doc(collection(db, "comptes", c.compte_uid, "mouvements")), {
    type: debiter ? "depense" : "remboursement",
    montant: signe * montant,
    note: "Commande " + (c.numero || c.id),
    quand: new Date().toISOString(),
    par: auth.currentUser.email
  });
  paquet.update(doc(db, "comptes", c.compte_uid), { solde: increment(signe * montant) });
  return debiter;
}

function appliquerStock(paquet, c, nouveauStatut) {
  const a = ajustementsStock(c, nouveauStatut);
  if (!a) return false;
  a.lignes.forEach(l => {
    paquet.update(doc(db, "boutique_produits", l.code),
      { stock: increment(a.signe * (l.qte || 0)) });
  });
  return a.drapeau;
}


/* ---------- Modification d'une commande ----------
   Ajouter, retirer, changer une quantité, déplacer la date — y compris sur
   un jour de fermeture, pour les commandes spéciales.

   Le prix : les lignes sont recalculées avec la même fonction que la vitrine
   et le checkout, à partir du prix catalogue et de la remise portée par la
   commande. Un article ajouté suit donc le tarif de groupe et le code promo
   comme s'il avait été commandé le jour même.

   Le stock : recalculé automatiquement, mais seulement si la commande a déjà
   été confirmée — avant confirmation, rien n'a été déduit.

   Le crédit : jamais touché. Si le total change alors qu'un crédit a été
   prélevé, l'écart est signalé et se règle à la main depuis la page Crédit. */

// Prix catalogue d'une ligne, avec repli sur le prix facturé si le produit
// a disparu du catalogue.
function prixBaseLigne(l) {
  const code = codeLigne(l);
  const fiche = code ? catalogue[code] : null;
  return fiche ? fiche.prix_vente : (Number(l.prix) || 0);
}

function rayonLigne(l) {
  const code = codeLigne(l);
  return (code && catalogue[code]) ? catalogue[code].rayon : "Other";
}

// Recalcule prix unitaires, sous-total et total d'un panier donné.
function recalculer(c, panier) {
  const fiche = c.code_promo
    ? { valeur: c.code_promo.valeur, type: c.code_promo.type,
        rayons: c.code_promo.rayons || [] }
    : null;

  const pourCalcul = panier.map(l => ({
    qte: Number(l.qte) || 0,
    prixBase: prixBaseLigne(l),
    rayon: rayonLigne(l)
  }));

  const calcul = calculerPrix(pourCalcul, Number(c.remise) || 0, fiche);

  const lignes = panier.map(l => ({
    code: codeLigne(l) || l.code || null,
    nom: l.nom,
    qte: Number(l.qte) || 0,
    prix: prixUnitaire(prixBaseLigne(l), Number(c.remise) || 0, calcul.source)
  }));

  const frais = c.frais_a_confirmer ? 0 : (Number(c.frais_livraison) || 0);

  return {
    lignes, calcul,
    sous_total: calcul.sousTotal,
    total: calcul.sousTotal + frais
  };
}

/* Écarts de stock entre l'ancien et le nouveau panier.
   Positif = pièces à rendre au stock, négatif = pièces à retirer. */
function ecartsStock(avant, apres) {
  const compte = (panier) => {
    const t = {};
    (panier || []).forEach(l => {
      const code = codeLigne(l);
      if (code && stockLimite[code]) t[code] = (t[code] || 0) + (Number(l.qte) || 0);
    });
    return t;
  };
  const a = compte(avant), b = compte(apres);
  const ecarts = {};
  new Set([...Object.keys(a), ...Object.keys(b)]).forEach(code => {
    const d = (a[code] || 0) - (b[code] || 0);
    if (d !== 0) ecarts[code] = d;
  });
  return ecarts;
}

function jourFerme(iso) {
  if (!iso) return false;
  const d = new Date(iso + "T12:00:00");
  return joursFermes.includes((d.getDay() + 6) % 7);
}

/* ---------- Écran de modification ---------- */
function ouvrirModification(c, el) {
  // Copie de travail : rien n'est touché tant que l'on n'enregistre pas.
  let panier = (c.panier || []).map(l => Object.assign({}, l));
  let date = c.date_retrait || "";

  const zone = el.querySelector(".edition");
  zone.hidden = false;

  const choixProduits = Object.entries(catalogue)
    .filter(([, f]) => f.publie)
    .sort((a, b) => a[1].nom.localeCompare(b[1].nom))
    .map(([code, f]) => `<option value="${code}">${echapper(f.nom)}</option>`)
    .join("");

  function dessiner() {
    const r = recalculer(c, panier);
    const ecartTotal = r.total - (Number(c.total) || 0);
    const credit = Number(c.credit_utilise) || 0;

    zone.innerHTML = `
      <div class="edit-lignes"></div>

      <div class="edit-ajout">
        <select class="edit-produit">${choixProduits}</select>
        <input type="number" class="edit-qte" min="1" step="1" value="1">
        <button type="button" class="mineur edit-plus">Ajouter</button>
      </div>

      <div class="edit-date">
        <label>Date de retrait</label>
        <input type="date" class="edit-jour" value="${date}">
        <span class="edit-avertit"></span>
      </div>

      <div class="edit-bilan">
        <div class="l"><span>Sous-total</span><span>${peso(r.sous_total)}</span></div>
        ${c.frais_a_confirmer ? "" : (Number(c.frais_livraison) > 0
          ? `<div class="l"><span>${echapper(c.option?.nom || "Livraison")}</span>
             <span>${peso(c.frais_livraison)}</span></div>` : "")}
        <div class="l somme"><span>Total</span><span>${peso(r.total)}</span></div>
        ${ecartTotal !== 0
          ? `<div class="l ecart"><span>Écart avec le total actuel</span>
             <span>${ecartTotal > 0 ? "+" : ""}${peso(ecartTotal)}</span></div>` : ""}
        ${credit > 0 && ecartTotal !== 0
          ? `<div class="edit-alerte">${peso(credit)} de crédit ont déjà été
             annoncés sur cette commande. Le solde du client n'est pas modifié :
             réglez l'écart de ${peso(Math.abs(ecartTotal))} à la main depuis la
             page Crédit.</div>` : ""}
      </div>

      <div class="edit-actions">
        <button type="button" class="action edit-ok">Enregistrer les modifications</button>
        <button type="button" class="mineur edit-annuler">Annuler</button>
      </div>`;

    // Lignes du panier
    const zl = zone.querySelector(".edit-lignes");
    if (!panier.length) {
      zl.innerHTML = '<div class="edit-vide">Plus aucun article. La commande ne peut pas être vide.</div>';
    } else {
      panier.forEach((l, i) => {
        const ligne = document.createElement("div");
        ligne.className = "edit-l";
        ligne.innerHTML = `
          <span class="n"></span>
          <input type="number" class="q" min="1" step="1" value="${Number(l.qte) || 1}">
          <span class="p">${peso(r.lignes[i].prix * (Number(l.qte) || 0))}</span>
          <button type="button" class="retirer" aria-label="Retirer">✕</button>`;
        ligne.querySelector(".n").textContent = l.nom || codeLigne(l) || "?";
        ligne.querySelector(".q").onchange = (e) => {
          const v = Math.max(1, Number(e.target.value) || 1);
          panier[i].qte = v;
          dessiner();
        };
        ligne.querySelector(".retirer").onclick = () => {
          panier.splice(i, 1);
          dessiner();
        };
        zl.appendChild(ligne);
      });
    }

    // Ajout d'un produit
    zone.querySelector(".edit-plus").onclick = () => {
      const code = zone.querySelector(".edit-produit").value;
      const qte = Math.max(1, Number(zone.querySelector(".edit-qte").value) || 1);
      const fiche = catalogue[code];
      if (!fiche) return;
      const deja = panier.find(l => codeLigne(l) === code);
      if (deja) deja.qte = (Number(deja.qte) || 0) + qte;   // pas de doublon
      else panier.push({ code, nom: fiche.nom, qte, prix: fiche.prix_vente });
      dessiner();
    };

    // Date, y compris un jour de fermeture
    const champJour = zone.querySelector(".edit-jour");
    const avertit = zone.querySelector(".edit-avertit");
    const majAvertissement = () => {
      avertit.textContent = jourFerme(champJour.value)
        ? "Jour de fermeture — autorisé, mais rien d'autre n'est cuit ce jour-là."
        : "";
    };
    majAvertissement();
    champJour.onchange = () => { date = champJour.value; majAvertissement(); };

    zone.querySelector(".edit-annuler").onclick = () => {
      zone.hidden = true;
      zone.innerHTML = "";
    };

    zone.querySelector(".edit-ok").onclick = () => enregistrerModification(c, panier, date);
  }

  dessiner();
}

async function enregistrerModification(c, panier, date) {
  if (!panier.length)
    return signaler("Une commande ne peut pas être vide. Annulez-la plutôt.", "err");
  if (!date)
    return signaler("La date de retrait est obligatoire.", "err");

  const r = recalculer(c, panier);
  const ecarts = ecartsStock(c.panier, r.lignes);
  // Le stock n'a été touché qu'à la confirmation : avant, il n'y a rien à rendre.
  const toucherStock = !!c.stock_deduit;

  const resume = [
    `${(c.panier || []).length} ligne(s) → ${r.lignes.length}`,
    `total ${peso(c.total)} → ${peso(r.total)}`,
    c.date_retrait !== date ? `date ${c.date_retrait} → ${date}` : null,
    toucherStock && Object.keys(ecarts).length
      ? "le stock sera ajusté en conséquence" : null
  ].filter(Boolean).join("\n");

  if (!confirm("Enregistrer ces modifications ?\n\n" + resume)) return;

  try {
    const paquet = writeBatch(db);

    paquet.update(doc(db, "commandes", c.id), {
      panier: r.lignes,
      date_retrait: date,
      sous_total: r.calcul.sousTotal,
      sous_total_brut: r.calcul.base,
      remise_montant: r.calcul.economie,
      remise_source: r.calcul.source,
      code_promo: c.code_promo
        ? Object.assign({}, c.code_promo,
            { montant: r.calcul.source === "promo" ? r.calcul.economie : 0 })
        : null,
      total: r.total,
      modifiee_le: new Date().toISOString(),
      modifiee_par: auth.currentUser?.email || ""
    });

    if (toucherStock) {
      Object.entries(ecarts).forEach(([code, d]) => {
        paquet.update(doc(db, "boutique_produits", code), { stock: increment(d) });
      });
    }

    await paquet.commit();

    // Mise à jour de la copie locale, sans recharger toute la page.
    c.panier = r.lignes;
    c.date_retrait = date;
    c.sous_total = r.calcul.sousTotal;
    c.total = r.total;
    c.remise_source = r.calcul.source;

    commandes.sort((a, b) =>
      (a.date_retrait || "").localeCompare(b.date_retrait || "") ||
      (b.cree_le || "").localeCompare(a.cree_le || ""));

    afficher();
    publierProduction();
    publierCharges();

    const credit = Number(c.credit_utilise) || 0;
    signaler(credit > 0
      ? "Commande modifiée. Vérifiez le crédit du client, il n'a pas été ajusté."
      : "Commande modifiée.", "ok");
  } catch (e) {
    console.error(e);
    signaler("La modification n'a pas pu être enregistrée.", "err");
  }
}

/* ---------- Traitement par lot ---------- */
$("lotStatut").innerHTML = '<option value="">Avancement…</option>' +
  STATUTS.map(v => `<option value="${v}">${LIBELLES[v]}</option>`).join("");
$("lotPaiement").innerHTML = '<option value="">Paiement…</option>' +
  Object.entries(PAIEMENTS).map(([v, t]) => `<option value="${v}">${t}</option>`).join("");

function majLot() {
  const n = selection.size;
  $("lot").classList.toggle("vu", n > 0);
  $("lotN").textContent = n + (n > 1 ? " commandes sélectionnées" : " commande sélectionnée");
  majBoutonLot();
}
function majBoutonLot() {
  $("lotAppliquer").disabled =
    !selection.size || (!$("lotStatut").value && !$("lotPaiement").value);
}
$("lotStatut").onchange = majBoutonLot;
$("lotPaiement").onchange = majBoutonLot;

$("lotAnnuler").onclick = () => {
  selection.clear();
  $("lotStatut").value = "";
  $("lotPaiement").value = "";
  afficher();
};

$("lotImprimer").onclick = () => {
  const choisies = commandes.filter(c => selection.has(c.id));
  if (!choisies.length) return;
  try {
    sessionStorage.setItem("etiquettes", JSON.stringify(choisies));
    window.open("etiquettes.html", "_blank");
  } catch (e) {
    console.error(e);
    signaler("Impossible d'ouvrir les étiquettes.", "err");
  }
};

$("lotSupprimer").onclick = async () => {
  const ids = [...selection];
  if (!ids.length) return;

  const choisies = ids.map(id => commandes.find(c => c.id === id)).filter(Boolean);
  const validees = choisies.filter(c => !["nouvelle", "annulee"].includes(c.statut));
  const issuesAbo = choisies.filter(c => c.abonnement_id);

  let message = `Supprimer définitivement ${ids.length} commande(s) ?\n\n` +
    "Cette action est irréversible.";
  if (validees.length) {
    message += `\n\n${validees.length} commande(s) déjà validée(s) : le stock et ` +
      "les avoirs déjà décomptés ne seront pas rendus.";
  }
  if (issuesAbo.length) {
    message += `\n\n${issuesAbo.length} commande(s) d'abonnement : l'échéance reste ` +
      "planifiée, la commande sera regénérée au prochain chargement. Sautez " +
      "l'échéance dans Abonnements pour l'éviter.";
  }
  if (!confirm(message)) return;

  $("lotSupprimer").disabled = true;
  signaler("Suppression…");

  try {
    // Firestore limite un lot à 500 écritures ; on découpe par prudence.
    for (let i = 0; i < ids.length; i += 400) {
      const paquet = writeBatch(db);
      ids.slice(i, i + 400).forEach(id => paquet.delete(doc(db, "commandes", id)));
      await paquet.commit();
    }

    commandes = commandes.filter(c => !selection.has(c.id));
    selection.clear();
    afficher();
    publierProduction();
    signaler(ids.length + " commande(s) supprimée(s).", "ok");
  } catch (e) {
    console.error(e);
    signaler("La suppression a échoué.", "err");
  } finally {
    $("lotSupprimer").disabled = false;
  }
};

$("lotAppliquer").onclick = async () => {
  const statut = $("lotStatut").value;
  const paiement = $("lotPaiement").value;
  const ids = [...selection];
  if (!ids.length || (!statut && !paiement)) return;

  const quoi = [statut ? LIBELLES[statut] : null, paiement ? PAIEMENTS[paiement] : null]
    .filter(Boolean).join(" et ");
  if (!confirm(`Appliquer « ${quoi} » à ${ids.length} commande(s) ?`)) return;

  $("lotAppliquer").disabled = true;
  signaler("Application…");

  try {
    // Firestore limite un lot à 500 écritures ; on découpe par prudence.
    for (let i = 0; i < ids.length; i += 400) {
      const paquet = writeBatch(db);
      ids.slice(i, i + 400).forEach(id => {
        const c = commandes.find(x => x.id === id);
        const champs = {};
        if (statut)   champs.statut = statut;
        if (paiement) champs["paiement.statut"] = paiement;
        if (statut && c) {
          const a = ajustementsStock(c, statut);
          if (a) champs.stock_deduit = appliquerStock(paquet, c, statut);
          const credit = appliquerCredit(paquet, c, statut);
          if (credit !== null) champs.credit_deduit = credit;
        }
        paquet.update(doc(db, "commandes", id), champs);
      });
      await paquet.commit();
    }

    ids.forEach(id => {
      const c = commandes.find(x => x.id === id);
      if (!c) return;
      if (statut) {
        const a = ajustementsStock(c, statut);
        if (a) c.stock_deduit = a.drapeau;
        c.statut = statut;
      }
      if (paiement) { c.paiement = c.paiement || {}; c.paiement.statut = paiement; }
    });

    // Les échéances d'abonnement suivent, une par une : chacune peut toucher
    // un compte différent, elles ne tiennent pas dans un lot commun.
    if (statut && SUITE_ECHEANCE[statut]) {
      for (const id of ids) {
        const c = commandes.find(x => x.id === id);
        if (c) await lierEcheance(c, statut);
      }
    }

    selection.clear();
    $("lotStatut").value = "";
    $("lotPaiement").value = "";
    afficher();
    publierProduction();
    publierCharges();
    signaler(ids.length + " commande(s) mise(s) à jour.", "ok");
  } catch (e) {
    console.error(e);
    signaler("Échec de la mise à jour groupée.", "err");
    majBoutonLot();
  }
};


/* ---------- Liaison commande → abonnement ----------
   Une commande d'abonnement porte abonnement_id et abonnement_rang : elle sait
   donc à quelle échéance elle correspond. Changer son statut ici met l'échéance
   à jour, pour ne pas avoir à refaire le même geste sur la page Abonnements.

     remise  → échéance livrée
     annulee → échéance sautée

   Un seul sens : la commande commande. La page Abonnements reste libre de
   marquer une livraison à la main, ce qui n'écrase rien ici.

   L'argent suit la livraison, comme sur la page Abonnements : quand
   l'abonnement est payé sur le crédit, marquer livré prélève le montant et
   inscrit le mouvement. Le drapeau echeance_appliquee évite tout double
   prélèvement si le statut est remis deux fois. */
const SUITE_ECHEANCE = { "remise": "livree", "annulee": "sautee" };

async function lierEcheance(c, nouveauStatut) {
  const suite = SUITE_ECHEANCE[nouveauStatut];
  if (!c.abonnement_id || !c.abonnement_rang || !suite) return;
  if (c.echeance_appliquee === suite) return;          // déjà fait

  try {
    const ref = doc(db, "abonnements", c.abonnement_id);
    const s = await getDoc(ref);
    if (!s.exists()) return;
    const a = s.data();

    // Le rang est de 1 à n ; l'échéance est à l'index rang − 1.
    const i = Number(c.abonnement_rang) - 1;
    const liste = a.echeances || [];
    if (!liste[i]) return;
    if (liste[i].statut === suite) {                   // déjà à jour côté abonnement
      await updateDoc(doc(db, "commandes", c.id), { echeance_appliquee: suite });
      c.echeance_appliquee = suite;
      return;
    }

    const echeances = liste.map((e, n) => n === i
      ? (suite === "livree"
          ? { ...e, statut: "livree", livree_le: new Date().toISOString() }
          : { ...e, statut: "sautee" })
      : e);

    const paquet = writeBatch(db);
    paquet.update(ref, { echeances });

    // Prélèvement du crédit, à l'identique de la page Abonnements.
    const surCredit = a.paiement?.mode === "credit";
    const montant = Number(a.total_par_livraison) || 0;
    if (suite === "livree" && surCredit && montant > 0 && a.client?.uid) {
      paquet.set(doc(collection(db, "comptes", a.client.uid, "mouvements")), {
        type: "depense", montant: -montant,
        note: "Livraison du " + liste[i].date,
        quand: new Date().toISOString(), par: auth.currentUser?.email || ""
      });
      paquet.update(doc(db, "comptes", a.client.uid), { solde: increment(-montant) });
    }

    // Plus aucune échéance planifiée : l'abonnement est terminé.
    if (!echeances.some(e => e.statut === "planifiee"))
      paquet.update(ref, { statut: "termine" });

    paquet.update(doc(db, "commandes", c.id), { echeance_appliquee: suite });
    await paquet.commit();
    c.echeance_appliquee = suite;

    signaler("Échéance d'abonnement mise à jour (" + suite + ").", "ok");
  } catch (e) {
    // La commande, elle, est bien enregistrée : on ne la fait pas échouer.
    console.error("Liaison échéance", e);
    signaler("Commande enregistrée, mais l'échéance d'abonnement n'a pas suivi.", "err");
  }
}

/* ---------- Enregistrement ---------- */
async function enregistrer(c, champs) {
  try {
    if (champs.statut) {
      const paquet = writeBatch(db);
      const deduit = appliquerStock(paquet, c, champs.statut);
      const maj = Object.assign({}, champs);
      const a = ajustementsStock(c, champs.statut);
      if (a) maj.stock_deduit = deduit;
      const credit = appliquerCredit(paquet, c, champs.statut);
      if (credit !== null) maj.credit_deduit = credit;
      paquet.update(doc(db, "commandes", c.id), maj);
      await paquet.commit();
      if (a) c.stock_deduit = deduit;
    } else {
      await updateDoc(doc(db, "commandes", c.id), champs);
    }
    if (champs.statut) {
      c.statut = champs.statut;
      await lierEcheance(c, champs.statut);
    }
    if (champs["paiement.statut"]) {
      c.paiement = c.paiement || {};
      c.paiement.statut = champs["paiement.statut"];
    }
    afficher();
    publierProduction();
    signaler("Enregistré");
  } catch (e) {
    console.error(e);
    signaler("Échec de l'enregistrement");
  }
}

let minuteur;
function signaler(texte, type = "") {
  $("etat").textContent = texte;
  $("etat").className = "etat vu " + type;
  clearTimeout(minuteur);
  minuteur = setTimeout(() => $("etat").classList.remove("vu"), 2600);
}
