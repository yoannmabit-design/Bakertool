<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commandes — Yoann's French Bakery</title>
<meta name="theme-color" content="#1a1a1a">
<style>
  :root{
    --creme:#fdf6ec;--papier:#fffdf9;--encre:#1f1b16;
    --encre-doux:#6b6157;--trait:#e2d7c6;--accent:#2f4858;
    --alerte:#8c2f22;--ok:#3d6b3d;--r:6px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--creme);color:var(--encre);
    font:16px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  header{
    background:var(--encre);color:var(--creme);padding:14px 18px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    position:sticky;top:0;z-index:5;
  }
  header h1{font-size:17px;margin:0;font-weight:600}
  header .qui{margin-left:auto;font-size:13px;opacity:.72}
  header button{
    background:transparent;border:1px solid #4a443c;color:var(--creme);
    padding:8px 13px;border-radius:var(--r);font-size:13.5px;cursor:pointer;
  }
  main{max-width:820px;margin:0 auto;padding:20px 16px 120px}

  .filtres{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}
  .filtres button{
    border:1px solid var(--trait);background:transparent;color:var(--encre-doux);
    padding:8px 15px;border-radius:var(--r);font-size:14px;cursor:pointer;
  }
  .filtres button[aria-pressed="true"]{
    background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;
  }

  .jour{font-size:14px;color:var(--encre-doux);margin:22px 0 9px;font-weight:600}
  .cmd{
    background:var(--papier);border:1px solid var(--trait);
    border-radius:var(--r);padding:14px;margin-bottom:10px;
  }
  .cmd.impaye{border-left:4px solid var(--alerte)}
  .cmd.reglee{border-left:4px solid var(--ok)}
  .tete{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;cursor:pointer}
  .tete .ref{font-family:ui-monospace,monospace;font-size:13px;color:var(--encre-doux)}
  .tete .nom{font-weight:600;flex:1;min-width:120px}
  .tete .montant{font-weight:600;font-variant-numeric:tabular-nums}
  .resume{font-size:13.5px;color:var(--encre-doux);margin-top:4px}

  .detail{margin-top:13px;padding-top:13px;border-top:1px dashed var(--trait)}
  .detail[hidden]{display:none}
  .detail .l{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;padding:2px 0}
  .info{font-size:14px;color:var(--encre-doux);margin:3px 0}
  .info b{color:var(--encre);font-weight:600}

  .actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:14px}
  select{
    padding:9px 10px;border:1px solid var(--trait);border-radius:var(--r);
    background:#fff;font:inherit;font-size:14.5px;color:var(--encre);
  }
  .lien{
    display:inline-block;padding:9px 14px;border:1px solid var(--trait);
    border-radius:var(--r);text-decoration:none;color:var(--accent);font-size:14px;
  }
  .etiq{
    font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;
    padding:3px 8px;border-radius:3px;background:#efe6d8;color:var(--encre-doux);
  }
  .etiq.rouge{background:#f6e2de;color:var(--alerte)}
  .etiq.verte{background:#e2eede;color:var(--ok)}

  .coche{width:19px;height:19px;flex-shrink:0;accent-color:var(--accent);cursor:pointer}
  .jour{display:flex;align-items:center;gap:10px}
  .jour .tout{
    font-size:12.5px;color:var(--accent);background:none;border:none;
    cursor:pointer;text-decoration:underline;padding:0;font-weight:400;
  }
  .lot{
    position:fixed;left:0;right:0;bottom:0;background:var(--encre);color:var(--creme);
    padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    transform:translateY(120%);transition:transform .18s ease;z-index:6;
  }
  .lot.vu{transform:translateY(0)}
  .lot .n{font-weight:600;margin-right:auto}
  .lot select{font-size:14px;padding:8px 9px}
  .lot .appliquer{
    background:var(--creme);color:var(--encre);border:none;padding:10px 16px;
    border-radius:var(--r);font-size:14.5px;font-weight:600;cursor:pointer;
  }
  .lot .appliquer:disabled{opacity:.45;cursor:default}
  .lot .annuler{
    background:transparent;border:1px solid #4a443c;color:var(--creme);
    padding:9px 13px;border-radius:var(--r);font-size:14px;cursor:pointer;
  }
  .vide{padding:44px;text-align:center;color:var(--encre-doux)}
  .connexion{max-width:400px;margin:14vh auto;text-align:center;padding:0 20px}
  .connexion h1{font-size:22px;margin:0 0 20px}
  .connexion button{
    background:var(--accent);color:#fff;border:none;padding:12px 22px;
    border-radius:var(--r);font-size:15px;font-weight:600;cursor:pointer;
  }
  .etat{
    position:fixed;bottom:84px;left:50%;transform:translateX(-50%);
    background:var(--encre);color:var(--creme);padding:10px 18px;
    border-radius:var(--r);font-size:14px;opacity:0;transition:opacity .2s;
  }
  .etat.vu{opacity:1}
</style>
</head>
<body>

<div id="ecranConnexion" class="connexion">
  <h1>Commandes</h1>
  <button id="btnConnexion">Se connecter avec Google</button>
  <p id="msgConnexion" style="margin-top:18px;font-size:14px"></p>
</div>

<div id="app" hidden>
  <header>
    <h1>Commandes</h1>
    <span class="qui" id="qui"></span>
    <button id="btnRecharger">Actualiser</button>
    <button id="btnDeconnexion">Quitter</button>
  </header>
  <main>
    <div class="filtres" id="filtres">
      <button data-f="actives" aria-pressed="true">À traiter</button>
      <button data-f="impayees" aria-pressed="false">Impayées</button>
      <button data-f="toutes" aria-pressed="false">Toutes</button>
    </div>
    <div id="liste"><div class="vide">Chargement…</div></div>
  </main>
</div>

<div class="lot" id="lot">
  <span class="n" id="lotN"></span>
  <select id="lotStatut">
    <option value="">Avancement…</option>
  </select>
  <select id="lotPaiement">
    <option value="">Paiement…</option>
  </select>
  <button class="appliquer" id="lotAppliquer" disabled>Appliquer</button>
  <button class="annuler" id="lotImprimer">Imprimer les étiquettes</button>
  <button class="annuler" id="lotAnnuler">Annuler</button>
</div>

<div class="etat" id="etat"></div>

<script src="admin-nav.js" defer></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, getDoc, setDoc, updateDoc, writeBatch, increment }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDuq8KS8M_Z8U7BlSp6MvE-6Y9OYYaDujE",
  authDomain: "bakertools-ae124.firebaseapp.com",
  projectId: "bakertools-ae124",
  storageBucket: "bakertools-ae124.firebasestorage.app",
  messagingSenderId: "978584667113",
  appId: "1:978584667113:web:868cc89788aff27717c178"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);
const $    = (id) => document.getElementById(id);
const peso = (n) => "₱" + Number(n || 0).toLocaleString("en-PH");

const STATUTS = ["nouvelle","confirmee","en production","prete","remise","annulee"];
const LIBELLES = {
  "nouvelle":"Nouvelle", "confirmee":"Confirmée", "en production":"En production",
  "prete":"Prête", "remise":"Remise", "annulee":"Annulée"
};
const PAIEMENTS = { "en attente":"En attente", "paye":"Payé", "rembourse":"Remboursé" };

let commandes = [], filtre = "actives";
let joursFermes = [];   // 0 = lundi
let stockLimite = {};   // { code produit : true } — produits à stock décompté
let nomVersCode = {};   // rattrapage : nom du produit -> code, pour les commandes d'avant les codes
const selection = new Set();

/* ---------- Connexion ---------- */
$("btnConnexion").onclick = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) {
    $("msgConnexion").textContent = "Connexion impossible. Autorisez les fenêtres surgissantes.";
    console.error(e);
  }
};
$("btnDeconnexion").onclick = () => signOut(auth);
$("btnRecharger").onclick   = charger;

onAuthStateChanged(auth, async (user) => {
  if (!user) { $("app").hidden = true; $("ecranConnexion").hidden = false; return; }

  let autorise = false;
  try { autorise = (await getDoc(doc(db, "admins", user.uid))).exists(); }
  catch (e) { console.error(e); }

  if (!autorise) {
    await signOut(auth);
    $("msgConnexion").innerHTML =
      "Ce compte n'a pas accès.<br>Identifiant : <code>" + user.uid + "</code>";
    return;
  }
  $("ecranConnexion").hidden = true;
  $("app").hidden = false;
  $("qui").textContent = user.email;
  charger();
});

/* ---------- Chargement ---------- */
async function charger() {
  try {
    // Quels produits ont un stock à décompter ?
    try {
      const p = await getDoc(doc(db, "parametres", "boutique"));
      if (p.exists()) joursFermes = p.data().jours_fermes || [];
    } catch (e) { console.error(e); }

    try {
      const cat = await getDocs(collection(db, "boutique_produits"));
      stockLimite = {}; nomVersCode = {};
      cat.forEach(d => {
        const v = d.data();
        if (v.mode_stock === "limite") stockLimite[d.id] = true;
        if (v.nom) nomVersCode[cle(v.nom)] = d.id;
      });
    } catch (e) { console.error(e); }

    const s = await getDocs(collection(db, "commandes"));
    commandes = [];
    s.forEach(d => commandes.push({ id: d.id, ...d.data() }));
    // Les plus proches en premier, puis les plus récemment reçues.
    commandes.sort((a, b) =>
      (a.date_retrait || "").localeCompare(b.date_retrait || "") ||
      (b.cree_le || "").localeCompare(a.cree_le || ""));
    afficher();
    publierProduction();
  } catch (e) {
    console.error(e);
    $("liste").innerHTML = '<div class="vide">Les commandes n\'ont pas pu être chargées.</div>';
  }
}

/* ---------- Filtres ---------- */
$("filtres").onclick = (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  filtre = b.dataset.f;
  $("filtres").querySelectorAll("button").forEach(x =>
    x.setAttribute("aria-pressed", x === b));
  afficher();
};

function retenue(c) {
  if (filtre === "toutes") return true;
  if (filtre === "impayees")
    return (c.paiement?.statut || "en attente") === "en attente" && c.statut !== "annulee";
  return !["remise", "annulee"].includes(c.statut);
}

/* ---------- Affichage ---------- */
function afficher() {
  const liste = $("liste");
  const vues = commandes.filter(retenue);
  liste.innerHTML = "";

  if (!vues.length) {
    liste.innerHTML = '<div class="vide">Aucune commande dans cette vue.</div>';
    return;
  }

  // Une commande sortie de la vue ne doit pas rester sélectionnée en douce.
  const visibles = new Set(vues.map(c => c.id));
  [...selection].forEach(id => { if (!visibles.has(id)) selection.delete(id); });

  let jourCourant = null;
  vues.forEach(c => {
    if (c.date_retrait !== jourCourant) {
      jourCourant = c.date_retrait;
      const t = document.createElement("div");
      t.className = "jour";
      const duJour = vues.filter(x => x.date_retrait === jourCourant).map(x => x.id);
      const toutes = duJour.every(id => selection.has(id));
      t.innerHTML = '<span></span><button type="button" class="tout"></button>';
      t.querySelector("span").textContent = dateLongue(jourCourant);
      const bTout = t.querySelector(".tout");
      bTout.textContent = toutes ? "Tout désélectionner" : "Tout sélectionner";
      bTout.onclick = () => {
        duJour.forEach(id => toutes ? selection.delete(id) : selection.add(id));
        afficher();
      };
      liste.appendChild(t);
    }
    liste.appendChild(carte(c));
  });

  majLot();
}

function dateLongue(iso) {
  if (!iso) return "Sans date";
  const d = new Date(iso + "T12:00:00");
  const texte = d.toLocaleDateString("fr-FR",
    { weekday: "long", day: "numeric", month: "long" });
  const auj = new Date(); auj.setHours(0, 0, 0, 0);
  const ecart = Math.round((d - auj) / 86400000);
  if (ecart === 0) return "Aujourd'hui — " + texte;
  if (ecart === 1) return "Demain — " + texte;
  if (ecart < 0)   return "Passée — " + texte;
  return texte;
}

function carte(c) {
  const paye = (c.paiement?.statut || "en attente") === "paye";
  const el = document.createElement("div");
  el.className = "cmd " + (paye ? "reglee" : "impaye");

  const articles = (c.panier || []).reduce((n, l) => n + l.qte, 0);

  el.innerHTML = `
    <div class="tete">
      <input type="checkbox" class="coche" aria-label="Sélectionner">
      <span class="ref">${c.numero || c.id}</span>
      <span class="nom"></span>
      <span class="etiq ${paye ? "verte" : "rouge"}">${paye ? "Payé" : "À encaisser"}</span>
      <span class="montant">${peso(c.total)}</span>
    </div>
    <div class="resume"></div>
    <div class="detail" hidden>
      <div class="lignes"></div>
      <p class="info" style="margin-top:11px"><b>Contact</b> ${c.client?.telephone || ""}</p>
      ${c.client?.adresse ? '<p class="info adresse"></p>' : ""}
      ${c.option?.lieu ? '<p class="info lieu"></p>' : ""}
      ${c.notes ? '<p class="info notes"></p>' : ""}
      <div class="actions">
        <select class="selStatut">
          ${STATUTS.map(s => `<option value="${s}">${LIBELLES[s]}</option>`).join("")}
        </select>
        <select class="selPaiement">
          ${Object.entries(PAIEMENTS).map(([v, t]) =>
            `<option value="${v}">${t}</option>`).join("")}
        </select>
        <a class="lien lienClient" target="_blank" rel="noopener">WhatsApp client</a>
      </div>
    </div>`;

  el.querySelector(".nom").textContent = c.client?.nom || "—";
  el.querySelector(".resume").textContent =
    [LIBELLES[c.statut] || c.statut, c.option?.nom, c.creneau,
     articles + (articles > 1 ? " articles" : " article")]
    .filter(Boolean).join(" · ");

  el.querySelector(".lignes").innerHTML = (c.panier || []).map(l =>
    `<div class="l"><span>${l.qte} × ${echapper(l.nom)}</span>
     <span>${peso(l.qte * l.prix)}</span></div>`).join("") +
    (c.frais_livraison > 0
      ? `<div class="l"><span>${echapper(c.option?.nom || "Livraison")}</span>
         <span>${peso(c.frais_livraison)}</span></div>` : "") +
    (c.frais_a_confirmer
      ? `<div class="l"><span>${echapper(c.option?.nom || "")}</span>
         <span>à confirmer</span></div>` : "");

  if (c.client?.adresse) el.querySelector(".adresse").textContent = c.client.adresse;
  if (c.option?.lieu)    el.querySelector(".lieu").textContent = c.option.lieu;
  if (c.notes)           el.querySelector(".notes").textContent = "Note : " + c.notes;

  const detail = el.querySelector(".detail");
  el.querySelector(".tete").onclick = () => { detail.hidden = !detail.hidden; };

  const coche = el.querySelector(".coche");
  coche.checked = selection.has(c.id);
  coche.onclick = (e) => e.stopPropagation();   // ne pas déplier la carte
  coche.onchange = () => {
    coche.checked ? selection.add(c.id) : selection.delete(c.id);
    majLot();
  };

  const selS = el.querySelector(".selStatut");
  const selP = el.querySelector(".selPaiement");
  selS.value = c.statut || "nouvelle";
  selP.value = c.paiement?.statut || "en attente";
  selS.onchange = () => enregistrer(c, { statut: selS.value });
  selP.onchange = () => enregistrer(c, { "paiement.statut": selP.value });

  el.querySelector(".lienClient").href =
    "https://wa.me/" + (c.client?.telephone || "").replace(/\D/g, "");

  return el;
}

function echapper(t) {
  return String(t ?? "").replace(/[&<>"]/g, x =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[x]));
}

/* ---------- Pont vers la production ----------
   Publie, pour la prochaine date de livraison, le total par code produit.
   Aucune donnée client : ce document est lisible par l'ERP sans risque. */
// Clé de rapprochement par nom, insensible aux accents et à la casse.
function cle(t) {
  return String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().replace(/[^a-z0-9]/g, "");
}

// Le code de la ligne, ou à défaut celui retrouvé d'après le nom du produit.
function codeLigne(l) {
  return l.code || nomVersCode[cle(l.nom)] || null;
}

function iso(d) {
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000)
    .toISOString().slice(0, 10);
}

function prochaineLivraison() {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  for (let i = 0; i < 14; i++) {
    if (!joursFermes.includes((d.getDay() + 6) % 7)) return iso(d);
    d.setDate(d.getDate() + 1);
  }
  return iso(new Date());
}

// Une commande entre en production dès qu'elle est confirmée par vous.
const RETENUS = ["confirmee", "en production", "prete"];

async function publierProduction() {
  try {
    const date = prochaineLivraison();
  const totaux = {}, noms = {};

  commandes
    .filter(c => c.date_retrait === date && RETENUS.includes(c.statut))
    .forEach(c => (c.panier || []).forEach(l => {
      const code = codeLigne(l);
      if (!code) { console.warn("Ligne sans code produit :", l.nom); return; }
      totaux[code] = (totaux[code] || 0) + (l.qte || 0);
      noms[code] = l.nom || code;
    }));

    await setDoc(doc(db, "production", "commandes_boutique"), {
      date, totaux, noms,
      nb_commandes: commandes.filter(c => c.date_retrait === date && RETENUS.includes(c.statut)).length,
      maj: new Date().toISOString()
    });
    console.log("Production publiée :", date, totaux);
  } catch (e) {
    console.error("Publication production", e);
    signaler("Publication vers l'ERP impossible.", "err");
  }
}

/* ---------- Décompte du stock ----------
   Confirmer une commande retire ses pièces du stock ; l'annuler les rend.
   Le drapeau stock_deduit évite tout double décompte. */
function ajustementsStock(c, nouveauStatut) {
  const dejaDeduit = !!c.stock_deduit;
  const doitDeduire = nouveauStatut === "confirmee" && !dejaDeduit;
  const doitRendre  = nouveauStatut === "annulee" && dejaDeduit;
  if (!doitDeduire && !doitRendre) return null;

  const signe = doitDeduire ? -1 : 1;
  const lignes = (c.panier || [])
    .map(l => Object.assign({}, l, { code: codeLigne(l) }))
    .filter(l => l.code && stockLimite[l.code]);
  return { lignes, signe, drapeau: doitDeduire };
}

function appliquerStock(paquet, c, nouveauStatut) {
  const a = ajustementsStock(c, nouveauStatut);
  if (!a) return false;
  a.lignes.forEach(l => {
    paquet.update(doc(db, "boutique_produits", l.code),
      { stock: increment(a.signe * (l.qte || 0)) });
  });
  return a.drapeau;
}

/* ---------- Traitement par lot ---------- */
$("lotStatut").innerHTML = '<option value="">Avancement…</option>' +
  STATUTS.map(v => `<option value="${v}">${LIBELLES[v]}</option>`).join("");
$("lotPaiement").innerHTML = '<option value="">Paiement…</option>' +
  Object.entries(PAIEMENTS).map(([v, t]) => `<option value="${v}">${t}</option>`).join("");

function majLot() {
  const n = selection.size;
  $("lot").classList.toggle("vu", n > 0);
  $("lotN").textContent = n + (n > 1 ? " commandes sélectionnées" : " commande sélectionnée");
  majBoutonLot();
}
function majBoutonLot() {
  $("lotAppliquer").disabled =
    !selection.size || (!$("lotStatut").value && !$("lotPaiement").value);
}
$("lotStatut").onchange = majBoutonLot;
$("lotPaiement").onchange = majBoutonLot;

$("lotAnnuler").onclick = () => {
  selection.clear();
  $("lotStatut").value = "";
  $("lotPaiement").value = "";
  afficher();
};

$("lotImprimer").onclick = () => {
  const choisies = commandes.filter(c => selection.has(c.id));
  if (!choisies.length) return;
  try {
    sessionStorage.setItem("etiquettes", JSON.stringify(choisies));
    window.open("etiquettes.html", "_blank");
  } catch (e) {
    console.error(e);
    signaler("Impossible d'ouvrir les étiquettes.", "err");
  }
};

$("lotAppliquer").onclick = async () => {
  const statut = $("lotStatut").value;
  const paiement = $("lotPaiement").value;
  const ids = [...selection];
  if (!ids.length || (!statut && !paiement)) return;

  const quoi = [statut ? LIBELLES[statut] : null, paiement ? PAIEMENTS[paiement] : null]
    .filter(Boolean).join(" et ");
  if (!confirm(`Appliquer « ${quoi} » à ${ids.length} commande(s) ?`)) return;

  $("lotAppliquer").disabled = true;
  signaler("Application…");

  try {
    // Firestore limite un lot à 500 écritures ; on découpe par prudence.
    for (let i = 0; i < ids.length; i += 400) {
      const paquet = writeBatch(db);
      ids.slice(i, i + 400).forEach(id => {
        const c = commandes.find(x => x.id === id);
        const champs = {};
        if (statut)   champs.statut = statut;
        if (paiement) champs["paiement.statut"] = paiement;
        if (statut && c) {
          const a = ajustementsStock(c, statut);
          if (a) champs.stock_deduit = appliquerStock(paquet, c, statut);
        }
        paquet.update(doc(db, "commandes", id), champs);
      });
      await paquet.commit();
    }

    ids.forEach(id => {
      const c = commandes.find(x => x.id === id);
      if (!c) return;
      if (statut) {
        const a = ajustementsStock(c, statut);
        if (a) c.stock_deduit = a.drapeau;
        c.statut = statut;
      }
      if (paiement) { c.paiement = c.paiement || {}; c.paiement.statut = paiement; }
    });

    selection.clear();
    $("lotStatut").value = "";
    $("lotPaiement").value = "";
    afficher();
    publierProduction();
    signaler(ids.length + " commande(s) mise(s) à jour.", "ok");
  } catch (e) {
    console.error(e);
    signaler("Échec de la mise à jour groupée.", "err");
    majBoutonLot();
  }
};

/* ---------- Enregistrement ---------- */
async function enregistrer(c, champs) {
  try {
    if (champs.statut) {
      const paquet = writeBatch(db);
      const deduit = appliquerStock(paquet, c, champs.statut);
      const maj = Object.assign({}, champs);
      const a = ajustementsStock(c, champs.statut);
      if (a) maj.stock_deduit = deduit;
      paquet.update(doc(db, "commandes", c.id), maj);
      await paquet.commit();
      if (a) c.stock_deduit = deduit;
    } else {
      await updateDoc(doc(db, "commandes", c.id), champs);
    }
    if (champs.statut) c.statut = champs.statut;
    if (champs["paiement.statut"]) {
      c.paiement = c.paiement || {};
      c.paiement.statut = champs["paiement.statut"];
    }
    afficher();
    publierProduction();
    signaler("Enregistré");
  } catch (e) {
    console.error(e);
    signaler("Échec de l'enregistrement");
  }
}

let minuteur;
function signaler(texte) {
  $("etat").textContent = texte;
  $("etat").classList.add("vu");
  clearTimeout(minuteur);
  minuteur = setTimeout(() => $("etat").classList.remove("vu"), 2200);
}
</script>
